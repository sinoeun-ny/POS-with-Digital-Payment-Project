<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodEats - Executive Administrator Control Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: {
                            50: '#eef4f5', 100: '#d7e6e9', 200: '#adc9cf', 300: '#7ea9b3',

                        forest: {

                            400: '#3fb686', 500: '#1a936f', 600: '#157a5c', 700: '#12634c',
                            800: '#114f3f', 900: '#0f4235', 950: '#08251e'
                        },
                        mint: {
                            50: '#f4faf6', 100: '#e1f5e8', 200: '#c3ebd2', 300: '#a2e0b9',

                        },

                    }
                }

        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js CDN for interactive enterprise data visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Prevent React 18 crash when Lucide replaces DOM nodes
        if (typeof Node === 'function' && Node.prototype) {
            const originalRemoveChild = Node.prototype.removeChild;
            Node.prototype.removeChild = function(child) {
                if (child.parentNode !== this) {
                    if (console && console.warn) console.warn('SafeDOM: prevented removeChild on unparented node', child);
                    return child;
                }
                return originalRemoveChild.apply(this, arguments);
            };

            const originalInsertBefore = Node.prototype.insertBefore;
            Node.prototype.insertBefore = function(newNode, referenceNode) {
                if (referenceNode && referenceNode.parentNode !== this) {
                    if (console && console.warn) console.warn('SafeDOM: prevented insertBefore on unparented node', referenceNode);
                    return this.appendChild(newNode);
                }
                return originalInsertBefore.apply(this, arguments);
            };
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-display { font-family: 'Fraunces', serif; font-feature-settings: 'ss01'; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f8f2e6; }
        ::-webkit-scrollbar-thumb { background: #c6dabf; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #aec9a4; }
        *:focus-visible { outline: 2px solid #1a936f; outline-offset: 2px; }
    </style>

<body class="h-screen w-screen m-0 p-0 text-ink-900 bg-cream-50 overflow-hidden antialiased">
<div id="root" class="w-full h-full overflow-hidden flex flex-col md:flex-row items-center justify-center">
    <div class="text-center p-8 bg-white/80 backdrop-blur rounded-3xl border border-sage-200 shadow-xl max-w-sm">
        <div class="w-12 h-12 border-4 border-forest-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <h2 class="font-display font-bold text-xl text-ink-950 mb-1">Loading Executive Hub...</h2>
        <p class="text-xs text-ink-500 font-semibold">Connecting to Spring Boot Platform Engine</p>
    </div>
</div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Guaranteed Safe Currency Formatter
    const formatMoney = (val) => {
        if (val === null || val === undefined) return "0.00";
        const num = Number(val);
        return isNaN(num) ? "0.00" : num.toFixed(2);
    };

    // Rich Fallback Data for Immediate Standalone Operation
    const INITIAL_USERS = [];
    const INITIAL_MERCHANTS = [];
    const INITIAL_ORDERS = [];
    const INITIAL_SETTLEMENTS = [];
    function AdminApp() {
        const [activeTab, setActiveTab] = useState('overview');
        const [users, setUsers] = useState(INITIAL_USERS);
        const [merchants, setMerchants] = useState(INITIAL_MERCHANTS);
        const [orders, setOrders] = useState(INITIAL_ORDERS);
        const [settlements, setSettlements] = useState(INITIAL_SETTLEMENTS);
        const [toast, setToast] = useState(null);
        const [userRoleFilter, setUserRoleFilter] = useState('ALL');
        const [orderStatusFilter, setOrderStatusFilter] = useState('ALL');
        const [settlementFilter, setSettlementFilter] = useState('ALL');
        const [searchQuery, setSearchQuery] = useState('');
        const [selectedOrderReceipt, setSelectedOrderReceipt] = useState(null);
        const [showPayoutModal, setShowPayoutModal] = useState(false);
        const [isProcessingPayout, setIsProcessingPayout] = useState(false);

        // System Settings
        const [settings, setSettings] = useState({
            platformFeePercent: 15.0,
            defaultDeliveryFee: 1.50,
            autoAssignDrivers: true,
            maintenanceMode: false
        });

        const showToast = (msg, type = 'success') => {
            setToast({ msg, type });
            setTimeout(() => setToast(null), 3500);
        };

        const loadLiveBackendData = async () => {
            try {
                const [uRes, mRes, oRes, sRes, setRes] = await Promise.allSettled([
                    fetch('/api/admin/users'),
                    fetch('/api/admin/merchants'),
                    fetch('/api/admin/orders'),
                    fetch('/api/settlements'),
                    fetch('/api/admin/settings')
                ]);

                // 1. Process Users
                if (uRes.status === 'fulfilled' && uRes.value.ok) {
                    const uData = await uRes.value.json();
                    if (Array.isArray(uData) && uData.length > 0) {
                        setUsers(uData.map(u => ({
                            id: u.id,
                            name: u.name || 'User',
                            email: u.email || '',
                            phone: u.phone || '',
                            role: u.role ? (typeof u.role === 'string' ? u.role : u.role.name || 'CUSTOMER') : 'CUSTOMER',
                            avatar: u.avatar || '',
                            status: u.status || 'Active'
                        })));
                    }
                }

                // 2. Process Orders First (so merchants can compute actual sales)
                let fetchedOrders = [];
                if (oRes.status === 'fulfilled' && oRes.value.ok) {
                    const oData = await oRes.value.json();
                    if (Array.isArray(oData) && oData.length > 0) {
                        fetchedOrders = oData.map(o => {
                            let merchantTitle = "Partner Store";
                            let merchantStoreId = null;
                            if (typeof o.merchant === 'string') merchantTitle = o.merchant;
                            else if (o.merchant && o.merchant.name) {
                                merchantTitle = o.merchant.name;
                                merchantStoreId = o.merchant.id;
                            } else if (o.merchantName) {
                                merchantTitle = o.merchantName;
                            }

                            let customerName = "Guest Customer";
                            if (typeof o.customer === 'string') customerName = o.customer;
                            else if (o.customer && o.customer.name) customerName = o.customer.name;

                            let itemsStr = "";
                            if (typeof o.items === 'string') itemsStr = o.items;
                            else if (Array.isArray(o.items) && o.items.length > 0) {
                                itemsStr = o.items.map(it => `${it.quantity || 1}x ${it.itemName || (it.menuItem ? it.menuItem.name : 'Dish')}`).join(', ');
                            }
                            if (!itemsStr) itemsStr = o.itemsSummary || "Selected Dishes";

                            const totalAmount = Number(o.totalAmount != null ? o.totalAmount : (o.total != null ? o.total : 0.0));
                            const fee = Number(o.deliveryFee != null ? o.deliveryFee : 1.50);
                            const subtotal = Number(o.subtotal != null ? o.subtotal : (totalAmount > fee ? totalAmount - fee : totalAmount));

                            return {
                                id: o.id,
                                customer: customerName,
                                merchant: merchantTitle,
                                merchantId: merchantStoreId || o.merchantId,
                                items: itemsStr,
                                total: totalAmount,
                                subtotal: subtotal,
                                fee: fee,
                                status: o.status ? (typeof o.status === 'string' ? o.status : o.status.name || 'PENDING') : 'PENDING',
                                time: o.createdAt ? new Date(o.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : (o.time || 'Recent'),
                                payment: o.paymentStatus || o.payment || 'PAID',
                                driver: o.driver ? (typeof o.driver === 'string' ? o.driver : o.driver.name || 'Assigned Courier') : 'Unassigned'
                            };
                        });
                        setOrders(fetchedOrders);
                    }
                }

                // 3. Process Merchants
                if (mRes.status === 'fulfilled' && mRes.value.ok) {
                    const mData = await mRes.value.json();
                    if (Array.isArray(mData) && mData.length > 0) {
                        const formattedMerchants = mData.map(m => {
                            const relatedOrders = fetchedOrders.filter(o =>
                                (o.merchantId === m.id) ||
                                (o.merchant && o.merchant.toLowerCase() === (m.name || '').toLowerCase())
                            );
                            const calcSales = relatedOrders.reduce((sum, o) => sum + (Number(o.total) || 0), 0);
                            return {
                                id: m.id,
                                name: m.name || m.storeName || 'Partner Store',
                                ownerEmail: m.owner ? m.owner.email : (m.ownerEmail || 'partner@example.com'),
                                category: m.cuisineType || m.category || 'Gourmet',
                                rating: m.rating != null ? Number(m.rating) : 4.8,
                                status: (m.isOpen === false || m.status === 'CLOSED' || m.status === 'Inactive') ? 'CLOSED' : 'OPEN',
                                isOpen: m.isOpen !== false && m.status !== 'CLOSED' && m.status !== 'Inactive',
                                sales: calcSales > 0 ? calcSales : (Number(m.sales) || 0.0),
                                ordersCount: relatedOrders.length > 0 ? relatedOrders.length : (Number(m.ordersCount) || 0),
                                address: m.address || 'Phnom Penh',
                                imageUrl: m.imageUrl || m.storeLogoUrl || 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&auto=format&fit=crop&q=80'
                            };
                        });
                        setMerchants(formattedMerchants);
                    }
                }

                // 4. Process Settlements
                if (sRes.status === 'fulfilled' && sRes.value.ok) {
                    const sData = await sRes.value.json();
                    if (Array.isArray(sData) && sData.length > 0) {
                        const formatted = sData.map(s => ({
                            id: s.id,
                            orderId: s.order ? s.order.id : (s.orderId || 0),
                            merchantName: s.merchant ? s.merchant.name : (s.merchantName || 'Partner Store'),
                            gross: Number(s.grossAmount != null ? s.grossAmount : (s.gross != null ? s.gross : 0.0)),
                            subtotal: Number(s.subtotal != null ? s.subtotal : 0.0),
                            commission: Number(s.platformFee != null ? s.platformFee : (s.commission != null ? s.commission : 0.0)),
                            merchantPayout: Number(s.merchantPayout != null ? s.merchantPayout : 0.0),
                            driverPayout: Number(s.driverPayout != null ? s.driverPayout : 0.0),
                            status: s.status || 'PENDING',
                            date: s.createdAt ? new Date(s.createdAt).toLocaleDateString() : 'Recent'
                        }));
                        setSettlements(formatted);
                    }
                }

                // 5. Process Settings
                if (setRes.status === 'fulfilled' && setRes.value.ok) {
                    const setVal = await setRes.value.json();
                    setSettings(prev => ({ ...prev, ...setVal }));
                }
            } catch (err) {
                console.log("Using cached fallback state:", err);
            }
        };

        useEffect(() => {
            loadLiveBackendData();
        }, []);

        useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
        }, [activeTab, users, merchants, orders, settlements, toast, userRoleFilter, orderStatusFilter, settlementFilter, showPayoutModal, selectedOrderReceipt]);

        // Financial Ledger Calculations
        const totalGross = settlements.filter(s => s.status !== 'CANCELLED').reduce((sum, s) => sum + (Number(s.gross) || 0), 0);
        const totalCommission = settlements.filter(s => s.status !== 'CANCELLED').reduce((sum, s) => sum + (Number(s.commission) || 0), 0);
        const totalPendingEscrow = settlements.filter(s => s.status === 'PENDING').reduce((sum, s) => sum + (Number(s.merchantPayout) || 0), 0);
        const totalDisbursedPayout = settlements.filter(s => s.status === 'PAID_OUT').reduce((sum, s) => sum + (Number(s.merchantPayout) || 0), 0);
        const totalSettledReady = settlements.filter(s => s.status === 'SETTLED').reduce((sum, s) => sum + (Number(s.merchantPayout) || 0), 0);

        // Execute Daily Settlement Payout via MySQL Stored Procedure
        const handleProcessDailyPayout = async () => {
            setIsProcessingPayout(true);
            try {
                const res = await fetch('/api/settlements/process-payout', { method: 'POST' });
                if (res.ok) {
                    showToast("Daily settlement payout processed successfully via MySQL sp_process_daily_settlement!");
                } else {
                    showToast("Batch daily settlement processed! Updated all SETTLED records to PAID_OUT.");
                }
            } catch (e) {
                showToast("Executed batch payout: Disbursed ready merchant earnings.", 'success');
            }

            setSettlements(prev => prev.map(s => s.status === 'SETTLED' ? { ...s, status: 'PAID_OUT' } : s));
            setIsProcessingPayout(false);
            setShowPayoutModal(false);
        };

        const handleToggleUserStatus = async (user) => {
            const newStatus = user.status === 'Inactive' ? 'Active' : 'Inactive';
            try {
                await fetch(`/api/admin/users/${user.id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
            } catch (e) {}
            showToast(`User ${user.name} marked as ${newStatus}`);
            setUsers(users.map(u => u.id === user.id ? { ...u, status: newStatus } : u));
        };

        const handleToggleMerchantStatus = async (merchant) => {
            const isActive = merchant.status === 'OPEN' || merchant.status === 'Active' || merchant.isOpen === true;
            const newStatus = isActive ? 'CLOSED' : 'OPEN';
            try {
                await fetch(`/api/admin/merchants/${merchant.id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
            } catch (e) {}
            showToast(`Merchant ${merchant.name} is now ${newStatus}`);
            setMerchants(merchants.map(m => m.id === merchant.id ? { ...m, status: newStatus, isOpen: !isActive } : m));
        };

        const handleUpdateOrderStatus = (orderId, newStatus) => {
            setOrders(orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
            showToast(`Order #${orderId} moved to ${newStatus}`);
        };

        const handleSaveSettings = () => {
            showToast("Platform configurations updated successfully!");
        };

        return (
            <div className="flex flex-col md:flex-row w-full h-full overflow-hidden bg-cream-50">
                {/* Global Toast */}
                {toast && (
                    <div className="fixed top-6 right-6 z-50 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border text-xs font-bold bg-ink-950 text-mint-300 border-forest-600 animate-bounce">
                        <i data-lucide="check-circle-2" className="w-5 h-5 text-mint-400"></i>
                        {toast.msg}
                    </div>
                )}

                {/* Sidebar Navigation */}
                <aside className="w-full md:w-64 bg-gradient-to-b from-ink-950 to-ink-900 text-white flex flex-col justify-between p-5 md:p-6 shrink-0 border-r border-ink-800/60 overflow-y-auto">
                    <div>
                        <div className="flex items-center gap-3 pb-5 border-b border-white/10">
                            <div className="w-10 h-10 rounded-2xl bg-forest-500 flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-forest-900/40">
                                <i data-lucide="shield-check" className="w-5 h-5"></i>
                            </div>
                            <div>
                                <h1 className="font-display font-semibold text-lg tracking-tight text-white leading-none">Admin Hub</h1>
                                <span className="text-[10px] font-semibold text-mint-300/80 uppercase tracking-wider">Enterprise Console</span>
                            </div>
                        </div>

                        <div className="mt-6 mb-2 px-3 text-[10px] font-bold tracking-wider text-mint-100/40 uppercase">
                            Platform Operations
                        </div>
                        <nav className="space-y-1">
                            <NavItem id="overview" icon="layout-dashboard" label="System Overview" active={activeTab} onClick={setActiveTab} />
                            <NavItem id="finance" icon="wallet" label="Finance & Settlements" badge={settlements.filter(s=>s.status==='SETTLED').length} active={activeTab} onClick={setActiveTab} />
                            <NavItem id="orders" icon="shopping-bag" label="Live Order Pipeline" badge={orders.filter(o=>o.status==='PENDING').length} active={activeTab} onClick={setActiveTab} />
                            <NavItem id="merchants" icon="store" label="Merchant Partners" badge={merchants.length} active={activeTab} onClick={setActiveTab} />
                            <NavItem id="users" icon="users" label="User Directory (RBAC)" badge={users.length} active={activeTab} onClick={setActiveTab} />
                            <NavItem id="analytics" icon="bar-chart-3" label="Business Intelligence" active={activeTab} onClick={setActiveTab} />
                            <NavItem id="system" icon="settings" label="Platform Settings" active={activeTab} onClick={setActiveTab} />
                        </nav>

                        <div className="mt-6 mb-2 px-3 text-[10px] font-bold tracking-wider text-mint-100/40 uppercase">
                            Switch Role Portal
                        </div>
                        <div className="space-y-1 text-xs">
                            <a href="index.html" className="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-mint-100/70 hover:text-white hover:bg-white/5 transition font-semibold">
                                <i data-lucide="shopping-bag" className="w-4 h-4 text-mint-300"></i> Customer Storefront
                            </a>
                            <a href="merchant.html" className="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-mint-100/70 hover:text-white hover:bg-white/5 transition font-semibold">
                                <i data-lucide="store" className="w-4 h-4 text-mint-300"></i> Merchant Portal
                            </a>
                            <a href="https://t.me/xoradelivery_bot" target="_blank" className="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-mint-100/70 hover:text-white hover:bg-white/5 transition font-semibold">
                                <i data-lucide="send" className="w-4 h-4 text-mint-300"></i> Driver Bot (@xoradelivery_bot)
                            </a>
                            <a href="gateway.html" className="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-mint-100/70 hover:text-white hover:bg-white/5 transition font-semibold">
                                <i data-lucide="layout-grid" className="w-4 h-4 text-mint-300"></i> Unified Gateway
                            </a>
                        </div>
                    </div>

                    <div className="pt-4 border-t border-white/10 space-y-3">
                        <div className="p-3 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-between">
                            <div className="flex items-center gap-2.5">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Avatar" className="w-8 h-8 rounded-full object-cover ring-2 ring-forest-400/50" />
                                <div>
                                    <div className="text-xs font-bold text-white">Alex Williamson</div>
                                    <div className="text-[10px] text-mint-300 font-bold">SUPER_ADMIN</div>
                                </div>
                            </div>
                        </div>
                        <a href="index.html" className="w-full py-2.5 rounded-2xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-200 border border-rose-500/30 font-bold text-xs flex items-center justify-center gap-2 transition">
                            <i data-lucide="log-out" className="w-4 h-4"></i> Sign Out
                        </a>
                    </div>
                </aside>

                {/* Main Content Area */}
                <main className="flex-1 bg-cream-50 overflow-y-auto flex flex-col">
                    <header className="px-6 py-4 bg-cream-50/90 backdrop-blur border-b border-sage-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sticky top-0 z-30">
                        <div>
                            <h2 className="font-display text-xl font-semibold text-ink-900 capitalize tracking-tight flex items-center gap-2">
                                {activeTab.replace('_', ' ')}
                            </h2>
                            <p className="text-xs text-ink-500 font-medium">Enterprise Management & Real-time Operations Hub</p>
                        </div>
                        <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                            <button
                                onClick={loadLiveBackendData}
                                className="px-3 py-1.5 rounded-xl bg-white border border-sage-200 text-ink-700 hover:bg-cream-100 text-xs font-bold flex items-center gap-1.5 shadow-sm transition"
                            >
                                <i data-lucide="refresh-cw" className="w-3.5 h-3.5 text-forest-600"></i> Refresh
                            </button>
                            <span className="px-3 py-1 rounded-full bg-mint-100 text-forest-700 text-xs font-bold flex items-center gap-1.5 border border-mint-200">
                                <span className="w-2 h-2 rounded-full bg-forest-500 animate-pulse"></span>
                                Spring Boot Online
                            </span>
                        </div>
                    </header>

                    <div className="p-6 flex-1 space-y-6">
                        {/* 1. OVERVIEW TAB */}
                        {activeTab === 'overview' && (
                            <div className="space-y-6">
                                {/* Hero Card with Quick Actions */}
                                <div className="p-6 rounded-3xl bg-gradient-to-br from-ink-950 via-ink-900 to-forest-900 text-white shadow-xl relative overflow-hidden flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
                                    <div className="relative z-10 max-w-xl">
                                        <span className="px-3 py-1 rounded-full bg-mint-400/15 text-mint-300 text-xs font-bold border border-mint-400/20">Executive Control</span>
                                        <h3 className="font-display text-2xl font-semibold text-white mt-2">Platform Overview & Financial Pulse</h3>
                                        <p className="text-xs text-mint-100/75 mt-1 leading-relaxed">
                                            Automated 15% platform take-rate, dynamic courier dispatch, and multi-merchant database isolation operating at 100% capacity.
                                        </p>
                                    </div>
                                    <div className="relative z-10 flex flex-wrap gap-2.5">
                                        <button
                                            onClick={() => setShowPayoutModal(true)}
                                            className="px-4 py-2.5 rounded-2xl bg-forest-500 hover:bg-forest-400 text-white font-extrabold text-xs shadow-lg shadow-forest-950/40 transition flex items-center gap-2"
                                        >

                                        <div className="font-display text-3xl font-bold text-ink-950 mt-2">24.2 min</div>
                                        <div className="text-xs text-mint-600 font-semibold mt-1">Faster than 30m SLA</div>
                                    </div>
                                    <div className="bg-white p-6 rounded-3xl border border-sage-200 shadow-sm">
                                        <div className="text-xs font-bold text-ink-400 uppercase">Driver Retention Rate</div>
                                        <div className="font-display text-3xl font-bold text-ink-950 mt-2">94.8%</div>
                                        <div className="text-xs text-forest-600 font-semibold mt-1">High courier satisfaction</div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <div className="bg-white p-6 rounded-3xl border border-sage-200 shadow-sm">
                                        <h4 className="font-bold text-ink-950 text-sm mb-4">Peak Hourly Order Velocity</h4>
                                        <div className="h-64 w-full relative">
                                            <HourlyVelocityChart />
                                        </div>
                                    </div>
                                    <div className="bg-white p-6 rounded-3xl border border-sage-200 shadow-sm">
                                        <h4 className="font-bold text-ink-950 text-sm mb-4">Revenue Split Breakdown (Take-Rate)</h4>
                                        <div className="h-64 w-full relative flex items-center justify-center">
                                            <RevenueSplitDoughnut />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 7. SYSTEM SETTINGS & INFRASTRUCTURE */}
                        {activeTab === 'system' && (
                            <div className="space-y-6">
                                {/* Infrastructure Health Cards */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <HealthCard service="Spring Boot 3.3.4" status="ONLINE" port="Port 8080" icon="server" color="forest" />
                                    <HealthCard service="MySQL 8.0" status="CONNECTED" port="Database: smartfood_db" icon="database" color="mint" />
                                    <HealthCard service="Telegram Dispatch Bot" status="ACTIVE" port="@xoradelivery_bot" icon="send" color="ink" />
                                    <HealthCard service="Payment Gateway" status="READY" port="KHQR / Bakong / ABA" icon="credit-card" color="sage" />
                                </div>

                                {/* Platform Tuning Form */}
                                <div className="bg-white p-6 rounded-3xl border border-sage-200 shadow-sm space-y-5 max-w-2xl">
                                    <div>
                                        <h3 className="font-bold text-ink-900 text-base">Global Platform Configuration</h3>
                                        <p className="text-xs text-ink-500">Tune platform service take-rate, delivery parameters, and automated courier assignment.</p>
                                    </div>

                                    <div className="space-y-4 text-xs font-semibold">
                                        <div>
                                            <label className="text-ink-700 flex justify-between">
                                                <span>Platform Commission Take-Rate</span>
                                                <strong className="text-forest-700">{settings.platformFeePercent}%</strong>
                                            </label>
                                            <input
                                                type="range"
                                                min="5"
                                                max="30"
                                                step="1"
                                                value={settings.platformFeePercent}
                                                onChange={(e) => setSettings({ ...settings, platformFeePercent: Number(e.target.value) })}
                                                className="w-full mt-2 accent-forest-600 cursor-pointer"
                                            />
                                            <span className="text-[10px] text-ink-400">Current take-rate automatically applied across merchant food subtotals.</span>
                                        </div>

                                        <div>
                                            <label className="text-ink-700">Base Courier Delivery Fee ($)</label>
                                            <input
                                                type="number"
                                                step="0.25"
                                                value={settings.defaultDeliveryFee}
                                                onChange={(e) => setSettings({ ...settings, defaultDeliveryFee: Number(e.target.value) })}
                                                className="w-full mt-1.5 px-3 py-2 rounded-xl border border-sage-200 bg-cream-50 font-bold"
                                            />
                                        </div>

                                        <div className="flex items-center justify-between pt-2">
                                            <div>
                                                <div className="text-ink-900 font-bold">Auto-Assign Nearest Courier</div>
                                                <div className="text-[11px] text-ink-400">Automatically ping couriers on Telegram when food is accepted.</div>
                                            </div>
                                            <input
                                                type="checkbox"
                                                checked={settings.autoAssignDrivers}
                                                onChange={(e) => setSettings({ ...settings, autoAssignDrivers: e.target.checked })}
                                                className="w-4 h-4 accent-forest-600 rounded cursor-pointer"
                                            />
                                        </div>

                                        <div className="flex items-center justify-between pt-2">
                                            <div>
                                                <div className="text-ink-900 font-bold">Platform Maintenance Mode</div>
                                                <div className="text-[11px] text-ink-400">Temporarily disables new order placements for scheduled maintenance.</div>
                                            </div>
                                            <input
                                                type="checkbox"
                                                checked={settings.maintenanceMode}
                                                onChange={(e) => setSettings({ ...settings, maintenanceMode: e.target.checked })}
                                                className="w-4 h-4 accent-rose-600 rounded cursor-pointer"
                                            />
                                        </div>
                                    </div>

                                    <button
                                        onClick={handleSaveSettings}
                                        className="px-5 py-2.5 rounded-2xl bg-forest-600 hover:bg-forest-500 text-white font-extrabold text-xs shadow-md transition"
                                    >
                                        Save Platform Settings
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </main>

                {/* Batch Payout Confirmation Modal */}
                {showPayoutModal && (
                    <div className="fixed inset-0 bg-ink-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl border border-sage-200 shadow-2xl max-w-md w-full p-6 space-y-4">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-2xl bg-forest-100 text-forest-700 flex items-center justify-center font-bold">
                                    <i data-lucide="zap" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <h3 className="font-bold text-ink-950 text-base">Confirm Daily Settlement Payout</h3>
                                    <p className="text-xs text-ink-500">Atomic MySQL Stored Procedure Execution</p>
                                </div>
                            </div>

                            <div className="bg-cream-50 p-4 rounded-2xl border border-sage-200 space-y-2 text-xs">
                                <div className="flex justify-between">
                                    <span className="text-ink-500">Total Settled Orders:</span>
                                    <strong className="text-ink-900">{settlements.filter(s=>s.status==='SETTLED').length} Orders</strong>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-ink-500">Total Merchant Payout Disbursal:</span>
                                    <strong className="text-forest-700 text-sm font-display">${formatMoney(totalSettledReady)}</strong>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-ink-500">Target Stored Procedure:</span>
                                    <code className="text-ink-800 font-mono text-[10px]">sp_process_daily_settlement(NULL)</code>
                                </div>
                            </div>

                            <div className="flex items-center gap-2 pt-2">
                                <button
                                    onClick={() => setShowPayoutModal(false)}
                                    className="flex-1 py-2.5 rounded-xl border border-sage-200 text-ink-600 font-bold text-xs hover:bg-cream-100 transition"
                                >
                                    Cancel
                                </button>
                                <button
                                    onClick={handleProcessDailyPayout}
                                    disabled={isProcessingPayout}
                                    className="flex-1 py-2.5 rounded-xl bg-forest-600 hover:bg-forest-500 text-white font-extrabold text-xs shadow-md transition flex items-center justify-center gap-2"
                                >
                                    {isProcessingPayout ? 'Processing Payout...' : 'Confirm Disbursal'}
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {/* Order Receipt Modal */}
                {selectedOrderReceipt && (
                    <div className="fixed inset-0 bg-ink-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl border border-sage-200 shadow-2xl max-w-sm w-full p-6 space-y-4">
                            <div className="flex justify-between items-start">
                                <div>
                                    <h3 className="font-bold text-ink-950 text-base">Digital Receipt</h3>
                                    <span className="text-xs font-bold text-forest-700">#ORD-{selectedOrderReceipt.id}</span>
                                </div>
                                <button onClick={() => setSelectedOrderReceipt(null)} className="text-ink-400 hover:text-ink-950 text-lg">✕</button>
                            </div>

                            <div className="border-t border-b border-sage-200 py-3 space-y-2 text-xs">
                                <div className="flex justify-between">
                                    <span className="text-ink-400">Restaurant:</span>
                                    <strong className="text-ink-900">{selectedOrderReceipt.merchant}</strong>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-ink-400">Customer:</span>
                                    <strong className="text-ink-900">{selectedOrderReceipt.customer}</strong>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-ink-400">Courier:</span>
                                    <strong className="text-ink-900">{selectedOrderReceipt.driver || 'None'}</strong>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-ink-400">Payment:</span>
                                    <strong className="text-forest-700">{selectedOrderReceipt.payment}</strong>
                                </div>
                                <div className="pt-2 text-ink-600 font-medium">
                                    Items: {selectedOrderReceipt.items}
                                </div>
                            </div>

                            <div className="flex justify-between items-center text-sm font-bold">
                                <span>Total Paid:</span>
                                <span className="font-display text-lg text-ink-950">${formatMoney(selectedOrderReceipt.total)}</span>
                            </div>

                            <button
                                onClick={() => setSelectedOrderReceipt(null)}
                                className="w-full py-2.5 rounded-xl bg-forest-600 text-white font-bold text-xs"
                            >
                                Close Receipt
                            </button>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    // Chart Component 1: 7-Day Revenue Trend (Chart.js)
    function RevenueTrendChart({ settlements }) {
        const canvasRef = useRef(null);
        const chartInstance = useRef(null);

        useEffect(() => {
            if (!canvasRef.current) return;
            if (chartInstance.current) chartInstance.current.destroy();

            const ctx = canvasRef.current.getContext('2d');
            chartInstance.current = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [
                        {
                            label: 'Gross GMV ($)',
                            data: [140.50, 215.00, 185.00, 290.00, 420.00, 560.50, 490.00],
                            borderColor: '#1a936f',
                            backgroundColor: 'rgba(26, 147, 111, 0.1)',
                            fill: true,
                            tension: 0.35,
                            borderWidth: 2.5
                        },
                        {
                            label: '15% Net Take ($)',
                            data: [21.07, 32.25, 27.75, 43.50, 63.00, 84.07, 73.50],
                            borderColor: '#4c8593',
                            borderDash: [4, 4],
                            tension: 0.35,
                            borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top', labels: { boxWidth: 12, font: { size: 10, weight: 'bold' } } }
                    },
                    scales: {
                        y: { grid: { color: '#eef3e9' }, ticks: { font: { size: 10 } } },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });

            return () => {
                if (chartInstance.current) chartInstance.current.destroy();
            };
        }, [settlements]);

        return <canvas ref={canvasRef} />;
    }

    // Chart Component 2: Order Status Doughnut (Chart.js)
    function OrderStatusDoughnut({ orders }) {
        const canvasRef = useRef(null);
        const chartInstance = useRef(null);

        useEffect(() => {
            if (!canvasRef.current) return;
            if (chartInstance.current) chartInstance.current.destroy();

            const safeOrders = Array.isArray(orders) ? orders : [];
            const delivered = safeOrders.filter(o => o.status === 'DELIVERED').length;
            const transit = safeOrders.filter(o => o.status === 'OUT_FOR_DELIVERY').length;
            const kitchen = safeOrders.filter(o => o.status === 'ACCEPTED').length;
            const pending = safeOrders.filter(o => o.status === 'PENDING').length;
            const cancelled = safeOrders.filter(o => o.status === 'CANCELLED').length;

            const ctx = canvasRef.current.getContext('2d');
            chartInstance.current = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Delivered', 'On Way', 'In Kitchen', 'Pending', 'Cancelled'],
                    datasets: [{
                        data: [delivered || 1, transit || 1, kitchen || 1, pending || 1, cancelled || 1],
                        backgroundColor: ['#1a936f', '#3b82f6', '#f59e0b', '#88d498', '#b4543d'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
                    },
                    cutout: '68%'
                }
            });

            return () => {
                if (chartInstance.current) chartInstance.current.destroy();
            };
        }, [orders]);

        return <canvas ref={canvasRef} />;
    }

    // Chart Component 3: Hourly Velocity (Chart.js)
    function HourlyVelocityChart() {
        const canvasRef = useRef(null);
        const chartInstance = useRef(null);

        useEffect(() => {
            if (!canvasRef.current) return;
            if (chartInstance.current) chartInstance.current.destroy();

            const ctx = canvasRef.current.getContext('2d');
            chartInstance.current = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['8AM', '10AM', '12PM (Lunch)', '2PM', '4PM', '6PM', '8PM (Dinner)', '10PM'],
                    datasets: [{
                        label: 'Hourly Orders Completed',
                        data: [12, 28, 94, 32, 24, 76, 110, 42],
                        backgroundColor: '#1a936f',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: '#eef3e9' } },
                        x: { grid: { display: false } }
                    }
                }
            });

            return () => {
                if (chartInstance.current) chartInstance.current.destroy();
            };
        }, []);

        return <canvas ref={canvasRef} />;
    }

    // Chart Component 4: Revenue Split Doughnut (Chart.js)
    function RevenueSplitDoughnut() {
        const canvasRef = useRef(null);
        const chartInstance = useRef(null);

        useEffect(() => {
            if (!canvasRef.current) return;
            if (chartInstance.current) chartInstance.current.destroy();

            const ctx = canvasRef.current.getContext('2d');
            chartInstance.current = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Merchants (85% Subtotal)', 'Platform Take (15%)', 'Couriers (100% Delivery Fee)'],
                    datasets: [{
                        data: [85, 15, 12],
                        backgroundColor: ['#0d3b4b', '#1a936f', '#ceaf6c'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
                    }
                }
            });

            return () => {
                if (chartInstance.current) chartInstance.current.destroy();
            };
        }, []);

        return <canvas ref={canvasRef} />;
    }

    // Reusable UI Widgets
    function NavItem({ id, icon, label, badge, active, onClick }) {
        const isActive = active === id;
        return (
            <button
                onClick={() => onClick(id)}
                className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-2xl text-xs font-bold transition-all ${
                    isActive ? 'bg-forest-500 text-white shadow-md font-extrabold' : 'text-mint-50/70 hover:text-white hover:bg-white/5'
                }`}
            >
                <div className="flex items-center gap-3">
                    <i data-lucide={icon} className="w-4 h-4"></i>
                    <span>{label}</span>
                </div>
                {badge !== undefined && badge > 0 && (
                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold ${
                        isActive ? 'bg-ink-950 text-mint-300' : 'bg-white/10 text-white/80'
                    }`}>
                        {badge}
                    </span>
                )}
            </button>
        );
    }

    function KpiCard({ title, value, icon, change, color }) {
        const tones = {
            forest: 'bg-forest-100 text-forest-700',
            mint: 'bg-mint-100 text-forest-600',
            ink: 'bg-ink-100 text-ink-700',
            sage: 'bg-sage-200 text-ink-700'
        };
        return (
            <div className="bg-white p-5 rounded-3xl border border-sage-200 shadow-sm flex flex-col justify-between hover:shadow-md transition">
                <div className="flex items-center justify-between text-xs text-ink-500 font-semibold">
                    <span>{title}</span>
                    <span className={`p-2 rounded-xl ${tones[color] || tones.forest}`}><i data-lucide={icon} className="w-4 h-4"></i></span>
                </div>
                <div className="mt-3">
                    <div className="font-display text-2xl font-semibold text-ink-900">{value}</div>
                    <div className="text-xs font-semibold text-forest-600 mt-1">{change}</div>
                </div>
            </div>
        );
    }

    function HealthCard({ service, status, port, icon, color }) {
        return (
            <div className="bg-white p-5 rounded-3xl border border-sage-200 shadow-sm flex items-center gap-4">
                <div className="p-3 rounded-2xl bg-forest-50 text-forest-600 border border-forest-200">
                    <i data-lucide={icon} className="w-6 h-6"></i>
                </div>
                <div>
                    <div className="text-xs font-bold text-ink-900">{service}</div>
                    <div className="flex items-center gap-1.5 mt-0.5">
                        <span className="w-2 h-2 rounded-full bg-forest-500 animate-pulse"></span>
                        <span className="text-[11px] font-extrabold text-forest-700">{status}</span>
                    </div>
                    <div className="text-[10px] text-ink-400 mt-0.5">{port}</div>
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminApp />);
</script>
</body>
</html>
