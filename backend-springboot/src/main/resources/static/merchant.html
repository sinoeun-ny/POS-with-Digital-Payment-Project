        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-display { font-family: 'Fraunces', serif; font-feature-settings: 'ss01'; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f8f2e6; }
        ::-webkit-scrollbar-thumb { background: #c6dabf; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #aec9a4; }
        *:focus-visible { outline: 2px solid #1a936f; outline-offset: 2px; }

</head>
<body class="h-screen w-screen m-0 p-0 text-ink-900 bg-cream-50 overflow-hidden antialiased">
<div id="root" class="w-full h-full overflow-hidden flex flex-col md:flex-row items-center justify-center">
    <div class="text-center p-8 bg-white/80 backdrop-blur rounded-3xl border border-sage-200 shadow-xl max-w-sm">
        <div class="w-12 h-12 border-4 border-forest-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <h2 class="font-display font-bold text-xl text-ink-950 mb-1">Loading Merchant Portal...</h2>
        <p class="text-xs text-ink-500 font-semibold">Sprint 2: Storefront & Menu Builder</p>
    </div>
</div>

<script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE = window.location.origin.includes('http') ? window.location.origin : 'http://localhost:8080';

    const INITIAL_STORES = [
        {
            id: 1,

        {

            address: "Monivong Blvd, Boeung Keng Kang 1, Phnom Penh",
            city: "Phnom Penh",

            openingHours: "11:00 AM - 11:00 PM",
            rating: 4.8,

            deliveryTimeMins: 25,
            isOpen: true,
            imageUrl: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=600&auto=format&fit=crop&q=80",
            bannerUrl: "https://images.unsplash.com/photo-1617196034796-73dfa7b1fd56?w=1200&auto=format&fit=crop&q=80"
        },
        {
            id: 3,
            name: "Khmer Coffee & Patisserie",
            cuisineType: "Café & Bakery",
            description: "Traditional slow-drip Mondulkiri iced coffee, French butter croissants, and fresh coconut pandan waffles.",
            address: "Norodom Blvd, Daun Penh, Phnom Penh",
            city: "Phnom Penh",
            phone: "+855 23 555 444",
            openingHours: "07:00 AM - 09:00 PM",
            rating: 4.9,
            deliveryFee: 1.00,
            deliveryTimeMins: 15,
            isOpen: true,
            imageUrl: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=600&auto=format&fit=crop&q=80",
            bannerUrl: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1200&auto=format&fit=crop&q=80"
        }
    ];

    const INITIAL_CATEGORIES = [
        { id: 1, merchantId: 1, name: "Signature Burgers", displayOrder: 1 },
        { id: 2, merchantId: 1, name: "Artisan Sides", displayOrder: 2 },
        { id: 3, merchantId: 1, name: "Craft Beverages", displayOrder: 3 }
    ];

    const INITIAL_ITEMS = [
        {
            id: 101,
            categoryId: 1,
            categoryName: "Signature Burgers",
            name: "Double Truffle Smash Burger",
            price: 7.25,
            description: "Double black angus beef patties, aged white cheddar, sautéed portobello, and black truffle aioli on a toasted brioche bun.",
            imageUrl: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&auto=format&fit=crop&q=80",
            isAvailable: true,
            prepTimeMinutes: 15,
            dietaryTag: "Chef Special",
            popularScore: 99,
            options: [
                { id: 1, optionGroup: "Patty Size", optionName: "Double 150g (Standard)", priceAdjustment: 0.00 },
                { id: 2, optionGroup: "Patty Size", optionName: "Triple Monster 225g", priceAdjustment: 2.25 },
                { id: 3, optionGroup: "Add-Ons", optionName: "Extra Aged Cheddar", priceAdjustment: 0.75 },
                { id: 4, optionGroup: "Add-Ons", optionName: "Smoked Applewood Bacon", priceAdjustment: 1.25 }
            ]
        },
        {
            id: 102,
            categoryId: 1,
            categoryName: "Signature Burgers",
            name: "Spicy Nashville Crispy Chicken",
            price: 5.75,
            description: "Buttermilk-brined crispy chicken thigh coated with Nashville cayenne glaze, spicy pickled cucumbers, and house slaw.",
            imageUrl: "https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?w=600&auto=format&fit=crop&q=80",
            isAvailable: true,
            prepTimeMinutes: 12,
            dietaryTag: "Spicy",
            popularScore: 94,
            options: [
                { id: 5, optionGroup: "Spice Level", optionName: "Mild Heat", priceAdjustment: 0.00 },
                { id: 6, optionGroup: "Spice Level", optionName: "Hot & Crispy", priceAdjustment: 0.00 },
                { id: 7, optionGroup: "Spice Level", optionName: "Extra Blazing Ghost Pepper", priceAdjustment: 0.50 }
            ]
        },
        {
            id: 103,
            categoryId: 2,
            categoryName: "Artisan Sides",
            name: "Parmesan Truffle French Fries",
            price: 2.95,
            description: "Hand-cut Idaho potato fries tossed with white truffle oil, freshly grated Grana Padano parmesan, and chives.",
            imageUrl: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=600&auto=format&fit=crop&q=80",
            isAvailable: true,
            prepTimeMinutes: 8,
            dietaryTag: "Vegetarian",
            popularScore: 88,
            options: []
        },
        {
            id: 104,
            categoryId: 3,
            categoryName: "Craft Beverages",
            name: "Salted Caramel Vanilla Shake",
            price: 3.50,
            description: "Hand-spun Madagascar vanilla gelato with sea salt caramel ribbon and whipped cream.",
            imageUrl: "https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=600&auto=format&fit=crop&q=80",
            isAvailable: false,
            prepTimeMinutes: 5,
            dietaryTag: "Dessert",
            popularScore: 82,
            options: []
        }
    ];

    function MerchantApp() {
        const [activeTab, setActiveTab] = useState('menu'); // 'store', 'categories', 'menu', 'orders', 'earnings'
        const [stores, setStores] = useState(INITIAL_STORES);
        const [selectedStoreId, setSelectedStoreId] = useState(1);
        const [categories, setCategories] = useState(INITIAL_CATEGORIES);
        const [selectedCategoryFilter, setSelectedCategoryFilter] = useState('ALL');
        const [menuItems, setMenuItems] = useState(INITIAL_ITEMS);
        const [toast, setToast] = useState(null);

        // Modals
        const [showItemModal, setShowItemModal] = useState(false);
        const [editingItem, setEditingItem] = useState(null);
        const [showCategoryModal, setShowCategoryModal] = useState(false);
        const [editingCategory, setEditingCategory] = useState(null);
        const [showAuthModal, setShowAuthModal] = useState(false);

        // Auth state (Allows all roles)
        const [currentUser, setCurrentUser] = useState({
            name: "Bopha Merchant",
            email: "merchant@example.com",
            role: "MERCHANT",
            token: "demo_jwt_token_merchant"
        });

        // Active Store
        const currentStore = stores.find(s => s.id === selectedStoreId) || stores[0];

        const showToast = (msg, type = 'success') => {
            setToast({ msg, type });
            setTimeout(() => setToast(null), 3200);
        };

        useEffect(() => {
            fetchStoresFromBackend();
            fetchCategoriesFromBackend(selectedStoreId);
            fetchMenuFromBackend(selectedStoreId);
        }, [selectedStoreId]);

        useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
        }, [activeTab, stores, selectedStoreId, categories, menuItems, toast, showItemModal, showCategoryModal, showAuthModal]);

        const handleLogout = () => {
            localStorage.removeItem('foodeats_auth_token');
            localStorage.removeItem('foodeats_auth_user');
            window.location.href = 'index.html';
        };

        // ==========================================
        // BACKEND REST API CALLS
        // ==========================================
        const fetchStoresFromBackend = async () => {
            try {
                const res = await fetch(`${API_BASE}/api/merchants`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.length > 0) setStores(data);
                }
            } catch (err) {
                console.log("Using cached stores data", err);
            }
        };

        const fetchCategoriesFromBackend = async (merchantId) => {
            try {
                const url = merchantId ? `${API_BASE}/api/categories?merchantId=${merchantId}` : `${API_BASE}/api/categories`;
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    if (data && Array.isArray(data)) {
                        setCategories(data);
                    }
                }
            } catch (err) {
                console.log("Using cached categories data", err);
            }
        };

        const fetchMenuFromBackend = async (merchantId) => {
            try {
                const res = await fetch(`${API_BASE}/api/menu?merchantId=${merchantId}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.length > 0) setMenuItems(data);
                }
            } catch (err) {
                console.log("Using cached menu data", err);
            }
        };

        // US-005: Store Open/Closed Toggle
        const toggleStoreStatus = async () => {
            const nextStatus = !currentStore.isOpen;
            try {
                await fetch(`${API_BASE}/api/merchants/${currentStore.id}/status?isOpen=${nextStatus}`, { method: 'PATCH' });
            } catch (e) {}

            const updatedStores = stores.map(s => s.id === currentStore.id ? { ...s, isOpen: nextStatus } : s);
            setStores(updatedStores);
            showToast(nextStatus ? `🟢 ${currentStore.name} is now OPEN to customer orders!` : `🔴 ${currentStore.name} is now CLOSED.`);
        };

        // US-005: Update Store Profile
        const handleSaveStoreProfile = async (e) => {
            e.preventDefault();
            const form = e.target;
            const updated = {
                ...currentStore,
                name: form.storeName.value,
                cuisineType: form.cuisineType.value,
                description: form.description.value,
                address: form.address.value,
                phone: form.phone.value,
                openingHours: form.openingHours.value,
                deliveryFee: parseFloat(form.deliveryFee.value) || 1.50,
                deliveryTimeMins: parseInt(form.deliveryTimeMins.value) || 20,
                imageUrl: form.imageUrl.value,
                bannerUrl: form.bannerUrl.value
            };

            try {
                await fetch(`${API_BASE}/api/merchants/${currentStore.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updated)
                });
            } catch (e) {}

            setStores(stores.map(s => s.id === currentStore.id ? updated : s));
            showToast("Store profile & branding successfully updated!");
        };

        // US-007: Inventory Availability Toggle
        const toggleItemAvailability = async (item) => {
            const nextState = !item.isAvailable;
            try {
                await fetch(`${API_BASE}/api/menu/${item.id}/availability?isAvailable=${nextState}`, { method: 'PATCH' });
            } catch (e) {}

            setMenuItems(menuItems.map(m => m.id === item.id ? { ...m, isAvailable: nextState } : m));
            showToast(nextState ? `"${item.name}" is now marked IN STOCK` : `"${item.name}" is now marked OUT OF STOCK / SOLD OUT`, nextState ? 'success' : 'warn');
        };

        // US-007 & US-008: Save / Add Menu Item with Options
        const handleSaveMenuItem = async (itemData) => {
            if (editingItem) {
                // Update
                try {
                    await fetch(`${API_BASE}/api/menu/${editingItem.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(itemData)
                    });
                } catch (e) {}

                setMenuItems(menuItems.map(m => m.id === editingItem.id ? { ...m, ...itemData } : m));
                showToast(`Updated "${itemData.name}" successfully!`);
            } else {
                // Create
                const newItem = {
                    ...itemData,
                    id: Date.now(),
                    merchantId: currentStore.id,
                    isAvailable: true
                };

                try {
                    const res = await fetch(`${API_BASE}/api/menu`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newItem)
                    });
                    if (res.ok) {
                        const saved = await res.json();
                        if (saved && saved.id) newItem.id = saved.id;
                    }
                } catch (e) {}

                setMenuItems([newItem, ...menuItems]);
                showToast(`Created new dish "${itemData.name}" with customization options!`);
            }
            setShowItemModal(false);
            setEditingItem(null);
        };

        const handleDeleteMenuItem = async (itemId) => {
            if (!confirm("Are you sure you want to delete this menu item?")) return;
            try {
                await fetch(`${API_BASE}/api/menu/${itemId}`, { method: 'DELETE' });
            } catch (e) {}
            setMenuItems(menuItems.filter(m => m.id !== itemId));
            showToast("Menu dish deleted from catalog.");
        };

        // US-006: Category Management
        const handleSaveCategory = async (name, displayOrder) => {
            const storeId = currentStore?.id || 1;
            const parsedOrder = parseInt(displayOrder) || (categories.length + 1);

            if (editingCategory) {
                try {
                    const res = await fetch(`${API_BASE}/api/categories/${editingCategory.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name.trim(), displayOrder: parsedOrder, merchantId: storeId })
                    });
                    if (res.ok) {
                        const updated = await res.json();
                        setCategories(categories.map(c => c.id === editingCategory.id ? { ...c, ...updated, name: updated.name || name, displayOrder: updated.displayOrder || parsedOrder } : c));
                        showToast(`Category "${name}" updated in database!`);
                        fetchCategoriesFromBackend(storeId);
                    } else {
                        const err = await res.json().catch(() => ({}));
                        showToast(err.message || "Failed to update category in DB", "warn");
                    }
                } catch (e) {
                    console.error("Category update network error:", e);
                    setCategories(categories.map(c => c.id === editingCategory.id ? { ...c, name, displayOrder: parsedOrder } : c));
                    showToast(`Category "${name}" updated locally.`);
                }
            } else {
                const payload = {
                    merchantId: storeId,
                    name: name.trim(),
                    displayOrder: parsedOrder
                };

                try {
                    const res = await fetch(`${API_BASE}/api/categories`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        const saved = await res.json();
                        setCategories([...categories, saved]);
                        showToast(`✅ Food category "${name}" saved to database!`);
                        fetchCategoriesFromBackend(storeId);
                    } else {
                        const err = await res.json().catch(() => ({}));
                        showToast(err.message || "Failed to save category to DB", "warn");
                        setCategories([...categories, { id: Date.now(), ...payload }]);
                    }
                } catch (e) {
                    console.error("Category save error:", e);
                    setCategories([...categories, { id: Date.now(), ...payload }]);
                    showToast(`Category "${name}" added locally.`);
                }
            }
            setShowCategoryModal(false);
            setEditingCategory(null);
        };

        const handleDeleteCategory = async (catId) => {
            if (!confirm("Are you sure you want to delete this category? Any associated menu items will be deleted or unassigned.")) return;
            try {
                const res = await fetch(`${API_BASE}/api/categories/${catId}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast("Category deleted from database.");
                }
            } catch (e) {
                console.error("Delete category error:", e);
            }
            setCategories(categories.filter(c => c.id !== catId));
            if (currentStore?.id) {
                fetchMenuFromBackend(currentStore.id);
            }
        };

        // Filtered menu items
        const filteredItems = selectedCategoryFilter === 'ALL'
            ? menuItems
            : menuItems.filter(m => {
                const cat = categories.find(c => c.id === m.categoryId);
                return cat ? cat.name === selectedCategoryFilter : m.categoryName === selectedCategoryFilter;
            });

        return (
            <div className="flex flex-col md:flex-row w-full h-full overflow-hidden bg-cream-50">
                {/* Toast Notification */}
                {toast && (
                    <div className="fixed top-6 right-6 z-50 px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 border text-sm font-semibold bg-ink-950 text-mint-300 border-forest-700 animate-bounce">
                        <i data-lucide={toast.type === 'warn' ? 'alert-triangle' : 'check-circle-2'} className="w-5 h-5 text-mint-400"></i>
                        <span>{toast.msg}</span>
                    </div>
                )}

                {/* Sidebar Navigation */}
                <aside className="w-full md:w-72 bg-gradient-to-b from-ink-950 via-ink-900 to-ink-950 text-white flex flex-col justify-between p-5 md:p-6 shrink-0 border-r border-ink-800/60 overflow-y-auto">
                    <div>
                        {/* Header Branding */}
                        <div className="flex items-center justify-between pb-5 border-b border-white/10">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-2xl bg-forest-500 flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-forest-900/40">
                                    <i data-lucide="chef-hat" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <h1 className="font-display font-bold text-lg text-white leading-none">Merchant Hub</h1>
                                    <span className="text-[10px] font-bold text-mint-300 uppercase tracking-wider">Sprint 2: Store & Menu</span>
                                </div>
                            </div>
                        </div>

                        {/* Multi-Role Quick Switch */}
                        <div className="mt-4 p-3 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="w-7 h-7 rounded-full bg-forest-500/30 border border-forest-400 flex items-center justify-center text-xs font-bold text-mint-300">
                                    {currentUser.name[0]}
                                </div>
                                <div className="leading-tight">
                                    <div className="text-xs font-bold text-white truncate w-28">{currentUser.name}</div>
                                    <span className="text-[9px] font-extrabold px-1.5 py-0.2 rounded bg-mint-400/20 text-mint-300 border border-mint-400/30 uppercase tracking-wider">
                                        {currentUser.role}
                                    </span>
                                </div>
                            </div>
                            <button
                                onClick={() => setShowAuthModal(true)}
                                className="px-2 py-1 bg-white/10 hover:bg-white/20 rounded-lg text-[10px] font-bold text-mint-200 transition"
                            >
                                Switch Role
                            </button>
                        </div>

                        {/* Active Restaurant Selector */}
                        <div className="mt-4 mb-3">
                            <label className="block text-[10px] font-bold tracking-wider text-mint-100/50 uppercase mb-1.5">
                                Select Active Merchant Store:
                            </label>
                            <select
                                value={selectedStoreId}
                                onChange={e => setSelectedStoreId(parseInt(e.target.value))}
                                className="w-full bg-white/10 border border-white/20 text-white rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:bg-ink-900 cursor-pointer"
                            >
                                {stores.map(s => (
                                    <option key={s.id} value={s.id} className="bg-ink-950 text-white font-medium">
                                        {s.name} ({s.isOpen ? '🟢 Open' : '🔴 Closed'})
                                    </option>
                                ))}
                            </select>
                        </div>

                        {/* Nav Items */}
                        <div className="mt-4 mb-2 px-3 text-[10px] font-bold tracking-wider text-mint-100/40 uppercase">
                            Storefront & Menu Suite
                        </div>
                        <nav className="space-y-1">
                            <NavItem id="menu" icon="book-open" label="Menu Builder & Stock" badge={menuItems.length} active={activeTab} onClick={setActiveTab} />
                            <NavItem id="categories" icon="layers" label="Categories Manager" badge={categories.length} active={activeTab} onClick={setActiveTab} />
                            <NavItem id="store" icon="store" label="Storefront & Branding" active={activeTab} onClick={setActiveTab} />
                            <NavItem id="orders" icon="bell-ring" label="Kitchen Order Tickets" active={activeTab} onClick={setActiveTab} />

                                    <input name="catName" defaultValue={editingCategory?.name || ''} required placeholder="e.g. Traditional Khmer Mains, Desserts" className="w-full bg-white border border-sage-300 rounded-2xl px-3 py-2 text-xs font-bold text-ink-900" />
                                </div>
                                <div>
                                    <label className="block font-bold text-ink-800 mb-1">Display Sort Order</label>
                                    <input name="displayOrder" type="number" defaultValue={editingCategory?.displayOrder || categories.length + 1} required className="w-full bg-white border border-sage-300 rounded-2xl px-3 py-2 text-xs font-bold text-ink-900" />
                                </div>
                                <div className="pt-2 flex justify-end gap-2">
                                    <button type="button" onClick={() => setShowCategoryModal(false)} className="px-4 py-2 rounded-xl bg-sage-100 font-bold text-ink-700">Cancel</button>
                                    <button type="submit" className="px-4 py-2 rounded-xl bg-forest-500 hover:bg-forest-600 font-extrabold text-white">Save Category</button>
                                </div>
                            </form>
                        </div>
                    </div>
                )}

                {/* ======================================================== */}
                {/* MODAL: FULL MULTI-ROLE REGISTRATION & LOGIN (US-001, US-002, US-003) */}
                {/* ======================================================== */}
                {showAuthModal && (
                    <MultiRoleAuthModal
                        currentUser={currentUser}
                        onClose={() => setShowAuthModal(false)}
                        onSuccessLogin={(user) => {
                            setCurrentUser(user);
                            setShowAuthModal(false);
                            showToast(`Welcome back, ${user.name}! Signed in as ${user.role}.`);
                            fetchStoresFromBackend();
                        }}
                        onSuccessRegister={(user, newStore) => {
                            setCurrentUser(user);
                            if (newStore) {
                                setStores([newStore, ...stores]);
                                setSelectedStoreId(newStore.id);
                            }
                            setShowAuthModal(false);
                            showToast(`🎉 Account created! Welcome, ${user.name} (${user.role}).`);
                        }}
                        showToast={showToast}
                    />
                )}
            </div>
        );
    }

    function MultiRoleAuthModal({ currentUser, onClose, onSuccessLogin, onSuccessRegister, showToast }) {
        const [mode, setMode] = useState('register'); // 'register' | 'login'
        const [selectedRole, setSelectedRole] = useState('MERCHANT'); // 'MERCHANT' | 'DRIVER' | 'CUSTOMER' | 'ADMIN'
        const [loading, setLoading] = useState(false);
        const [errorMsg, setErrorMsg] = useState('');

        // Registration form state
        const [regName, setRegName] = useState('');
        const [regEmail, setRegEmail] = useState('');
        const [regPassword, setRegPassword] = useState('password123');
        const [regPhone, setRegPhone] = useState('+855 12 888 999');
        // Merchant specific fields
        const [restaurantName, setRestaurantName] = useState('');
        const [cuisineType, setCuisineType] = useState('Khmer & Asian Fusion');
        const [storeAddress, setStoreAddress] = useState('Street 271, Phnom Penh');
        const [city, setCity] = useState('Phnom Penh');
        // Driver specific fields
        const [vehicleType, setVehicleType] = useState('Motorbike');
        const [plateNumber, setPlateNumber] = useState('PP 1AB-8899');
        // Customer specific fields
        const [deliveryAddress, setDeliveryAddress] = useState('Building 10, St. 51, BKK1, Phnom Penh');

        // Login form state
        const [loginEmail, setLoginEmail] = useState('');
        const [loginPassword, setLoginPassword] = useState('');

        const handleRegisterSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            setErrorMsg('');

            const payload = {
                name: regName.trim(),
                email: regEmail.trim().toLowerCase(),
                password: regPassword,
                phone: regPhone.trim(),
                role: selectedRole,
                restaurantName: selectedRole === 'MERCHANT' ? (restaurantName.trim() || regName + ' Kitchen') : null,
                cuisineType: selectedRole === 'MERCHANT' ? cuisineType : null,
                address: selectedRole === 'MERCHANT' ? storeAddress : (selectedRole === 'CUSTOMER' ? deliveryAddress : null),
                city: city,
                vehicleType: selectedRole === 'DRIVER' ? vehicleType : null,
                plateNumber: selectedRole === 'DRIVER' ? plateNumber : null
            };

            try {
                const res = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    const data = await res.json();
                    const newUser = {
                        name: data.name,
                        email: data.email,
                        role: data.role,
                        token: data.token,
                        id: data.userId
                    };

                    let newStore = null;
                    if (data.role === 'MERCHANT' && data.merchantId) {
                        newStore = {
                            id: data.merchantId,
                            name: payload.restaurantName,
                            cuisineType: payload.cuisineType,
                            description: `Welcome to ${payload.restaurantName}! Fresh gourmet food delivered fast.`,
                            address: payload.address,
                            city: payload.city,
                            phone: payload.phone,
                            openingHours: "08:00 AM - 10:00 PM",
                            rating: 5.0,
                            deliveryFee: 1.50,
                            deliveryTimeMins: 20,
                            isOpen: true,
                            imageUrl: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&auto=format&fit=crop&q=80",
                            bannerUrl: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1200&auto=format&fit=crop&q=80"
                        };
                    }

                    onSuccessRegister(newUser, newStore);
                } else {
                    const err = await res.json().catch(() => ({}));
                    setErrorMsg(err.message || "Registration failed. Email might already exist.");
                }
            } catch (err) {
                // Fallback simulation mode
                const simulatedUser = {
                    name: payload.name,
                    email: payload.email,
                    role: payload.role,
                    token: "jwt_token_" + Date.now(),
                    id: Date.now()
                };
                let simStore = null;
                if (payload.role === 'MERCHANT') {
                    simStore = {
                        id: Date.now(),
                        name: payload.restaurantName || payload.name + " Eatery",
                        cuisineType: payload.cuisineType || "Specialty Kitchen",
                        description: "Freshly registered merchant kitchen on FoodEats platform.",
                        address: payload.address || "Phnom Penh Central",
                        city: "Phnom Penh",
                        phone: payload.phone,
                        openingHours: "08:00 AM - 10:00 PM",
                        rating: 5.0,
                        deliveryFee: 1.50,
                        deliveryTimeMins: 20,
                        isOpen: true,
                        imageUrl: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600",
                        bannerUrl: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1200"
                    };
                }
                onSuccessRegister(simUser, simStore);
            } finally {
                setLoading(false);
            }
        };

        const handleLoginSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            setErrorMsg('');

            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: loginEmail.trim().toLowerCase(), password: loginPassword })

                    const data = await res.json();
                    onSuccessLogin({
                        name: data.name,
                        email: data.email,
                        role: data.role,
                        token: data.token,
                        id: data.userId
                    });
                } else {
                    const err = await res.json().catch(() => ({}));
                    setErrorMsg(err.message || "Invalid email or password. Please try again.");
                }

                // Fallback
                onSuccessLogin({
                    name: loginEmail.split('@')[0],
                    email: loginEmail,
                    role: "MERCHANT",
                    token: "jwt_token_demo"
                });
            } finally {
                setLoading(false);

                        <div className="p-3 rounded-2xl bg-rust-50 border border-rust-200 text-rust-800 text-xs font-semibold flex items-center gap-2">
                            <i data-lucide="alert-circle" className="w-4 h-4 text-rust-600"></i>
                            <span>{errorMsg}</span>

                    {/* =================================================== */}
                    {/* VIEW A: REGISTER (US-001 & US-002 ONBOARDING) */}

                    {mode === 'register' && (

                                    Step 1: Choose Your Account Role (US-003)

                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">

                                        { role: 'MERCHANT', icon: 'store', label: 'Merchant', desc: 'Store & Menu' },
                                        { role: 'DRIVER', icon: 'bike', label: 'Driver', desc: 'Deliveries' },
                                        { role: 'CUSTOMER', icon: 'shopping-bag', label: 'Customer', desc: 'Order Food' },
                                        { role: 'ADMIN', icon: 'shield', label: 'Admin', desc: 'Platform' }

                                        <button

                                            onClick={() => setSelectedRole(item.role)}
                                            className={`p-2.5 rounded-2xl border text-center transition flex flex-col items-center justify-center gap-1 ${selectedRole === item.role ? 'bg-forest-500 text-white border-forest-600 shadow-md ring-2 ring-forest-400/30 font-extrabold' : 'bg-cream-50 text-ink-800 border-sage-200 hover:bg-sage-100'}`}

                                        <label className="block text-[11px] font-bold text-ink-600 mb-1">Password *</label>
                                        <input
                                            type="password"
                                            required
                                            value={regPassword}
                                            onChange={e => setRegPassword(e.target.value)}
                                            placeholder="••••••••"
                                            className="w-full bg-cream-50 border border-sage-300 rounded-2xl px-3 py-2 text-xs font-bold text-ink-900 focus:bg-white"
                                        />
                                    </div>
                                </div>
                            </div>

                            {/* ROLE SPECIFIC ONBOARDING FIELDS (US-002) */}
                            {selectedRole === 'MERCHANT' && (
                                <div className="p-3.5 bg-mint-50/70 rounded-2xl border border-forest-200 space-y-2.5 animate-fadeIn">
                                    <div className="flex items-center gap-2 text-forest-900 font-extrabold text-xs">
                                        <i data-lucide="store" className="w-4 h-4 text-forest-700"></i>
                                        Merchant Storefront Setup (US-002 & US-005)
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-[10px] font-bold text-ink-700 mb-0.5">Restaurant Name *</label>
                                            <input
                                                required
                                                value={restaurantName}
                                                onChange={e => setRestaurantName(e.target.value)}
                                                placeholder="e.g. Angkor Gourmet BBQ"
                                                className="w-full bg-white border border-forest-300 rounded-xl px-2.5 py-1.5 text-xs font-bold text-ink-900"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-ink-700 mb-0.5">Cuisine Type *</label>
                                            <input
                                                required
                                                value={cuisineType}
                                                onChange={e => setCuisineType(e.target.value)}
                                                placeholder="e.g. Khmer Traditional, Burgers, Sushi"
                                                className="w-full bg-white border border-forest-300 rounded-xl px-2.5 py-1.5 text-xs font-bold text-ink-900"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold text-ink-700 mb-0.5">Restaurant Address *</label>
                                        <input
                                            required
                                            value={storeAddress}
                                            onChange={e => setStoreAddress(e.target.value)}
                                            placeholder="Street 302, Sangkat BKK1, Phnom Penh"
                                            className="w-full bg-white border border-forest-300 rounded-xl px-2.5 py-1.5 text-xs font-bold text-ink-900"
                                        />
                                    </div>
                                </div>
                            )}

                            {selectedRole === 'DRIVER' && (
                                <div className="p-3.5 bg-amber-50/70 rounded-2xl border border-amber-200 space-y-2.5 animate-fadeIn">
                                    <div className="flex items-center gap-2 text-amber-900 font-extrabold text-xs">
                                        <i data-lucide="bike" className="w-4 h-4 text-amber-700"></i>
                                        Driver Fleet Onboarding (US-002 & US-019)
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-[10px] font-bold text-ink-700 mb-0.5">Vehicle Type</label>
                                            <select
                                                value={vehicleType}
                                                onChange={e => setVehicleType(e.target.value)}
                                                className="w-full bg-white border border-amber-300 rounded-xl px-2.5 py-1.5 text-xs font-bold text-ink-900"
                                            >
                                                <option value="Motorbike">🛵 Motorbike / Scooter</option>
                                                <option value="Bicycle">🚲 Eco Bicycle</option>
                                                <option value="Electric Scooter">⚡ Electric Scooter</option>
                                                <option value="Car">🚗 Express Car</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-ink-700 mb-0.5">Plate Number / Hub</label>
                                            <input
                                                value={plateNumber}
                                                onChange={e => setPlateNumber(e.target.value)}
                                                placeholder="PP 1AB-8899"
                                                className="w-full bg-white border border-amber-300 rounded-xl px-2.5 py-1.5 text-xs font-bold text-ink-900"
                                            />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {selectedRole === 'CUSTOMER' && (
                                <div className="p-3.5 bg-sage-50 rounded-2xl border border-sage-200 space-y-2 animate-fadeIn">
                                    <label className="block text-[10px] font-bold text-ink-700">Default Delivery Address (US-004)</label>
                                    <input
                                        value={deliveryAddress}
                                        onChange={e => setDeliveryAddress(e.target.value)}
                                        placeholder="Building 42, St. 302, BKK1, Phnom Penh"
                                        className="w-full bg-white border border-sage-300 rounded-xl px-2.5 py-1.5 text-xs font-bold text-ink-900"
                                    />
                                </div>
                            )}

                            <div className="pt-2 flex items-center justify-end gap-2">
                                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl bg-sage-100 hover:bg-sage-200 font-bold text-xs text-ink-700">
                                    Cancel
                                </button>
                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="px-6 py-2 rounded-xl bg-forest-500 hover:bg-forest-600 font-extrabold text-xs text-white shadow-md transition flex items-center gap-1.5 disabled:opacity-50"
                                >
                                    {loading ? 'Creating Account...' : `Register as ${selectedRole} (US-001)`}
                                </button>
                            </div>
                        </form>
                    )}

                    {/* =================================================== */}
                    {/* VIEW B: SIGN IN WITH JWT */}
                    {/* =================================================== */}
                    {mode === 'login' && (
                        <form onSubmit={handleLoginSubmit} className="space-y-4">
                            <div className="space-y-3">
                                <div>
                                    <label className="block text-xs font-bold text-ink-700 mb-1">Email Address *</label>
                                    <input
                                        type="email"
                                        required
                                        value={loginEmail}
                                        onChange={e => setLoginEmail(e.target.value)}
                                        placeholder="merchant@example.com"
                                        className="w-full bg-cream-50 border border-sage-300 rounded-2xl px-3 py-2 text-xs font-bold text-ink-900 focus:bg-white"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-ink-700 mb-1">Password *</label>
                                    <input
                                        type="password"
                                        required
                                        value={loginPassword}
                                        onChange={e => setLoginPassword(e.target.value)}
                                        placeholder="••••••••"
                                        className="w-full bg-cream-50 border border-sage-300 rounded-2xl px-3 py-2 text-xs font-bold text-ink-900 focus:bg-white"
                                    />
                                </div>
                            </div>

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full py-2.5 rounded-2xl bg-forest-500 hover:bg-forest-600 font-extrabold text-xs text-white shadow-md transition disabled:opacity-50"
                            >
                                {loading ? 'Authenticating...' : 'Sign In with JWT'}
                            </button>

                            {/* 1-Click Quick Accounts */}
                            <div className="pt-3 border-t border-sage-100 space-y-2">
                                <label className="block text-[11px] font-bold text-ink-500 uppercase tracking-wider">
                                    ⚡ Quick 1-Click Demo Accounts:
                                </label>
                                <div className="grid grid-cols-2 gap-2 text-xs">
                                    <button
                                        type="button"
                                        onClick={() => onSuccessLogin({ name: "Bopha Merchant", email: "merchant@example.com", role: "MERCHANT", token: "jwt_bopha" })}
                                        className="p-2 rounded-xl bg-mint-50 border border-mint-200 hover:bg-mint-100 text-left font-bold text-forest-900"
                                    >
                                        👨‍🍳 Bopha (Merchant)
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => onSuccessLogin({ name: "Dara Driver", email: "driver@example.com", role: "DRIVER", token: "jwt_dara" })}
                                        className="p-2 rounded-xl bg-amber-50 border border-amber-200 hover:bg-amber-100 text-left font-bold text-amber-900"
                                    >
                                        🛵 Dara (Driver)
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => onSuccessLogin({ name: "Sokha Customer", email: "customer@example.com", role: "CUSTOMER", token: "jwt_sokha" })}
                                        className="p-2 rounded-xl bg-sage-50 border border-sage-200 hover:bg-sage-100 text-left font-bold text-ink-800"
                                    >
                                        🛍️ Sokha (Customer)
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => onSuccessLogin({ name: "System Admin", email: "admin@example.com", role: "ADMIN", token: "jwt_admin" })}
                                        className="p-2 rounded-xl bg-ink-950 text-mint-300 border border-ink-800 text-left font-bold"
                                    >
                                        🛡️ System Admin
                                    </button>
                                </div>
                            </div>
                        </form>
                    )}
                </div>
            </div>
        );
    }

    function NavItem({ id, icon, label, badge, active, onClick }) {
        const isActive = active === id;
        return (
            <button onClick={() => onClick(id)} className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-2xl text-xs font-bold transition-all ${isActive ? 'bg-forest-500 text-white shadow-md font-extrabold' : 'text-mint-50/70 hover:text-white hover:bg-white/5'}`}>
                <div className="flex items-center gap-3">
                    <i data-lucide={icon} className="w-4 h-4"></i>
                    <span>{label}</span>
                </div>
                {badge !== undefined && badge > 0 && (
                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold ${isActive ? 'bg-ink-950 text-mint-300' : 'bg-white/10 text-white/80'}`}>{badge}</span>
                )}
            </button>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MerchantApp />);
</script>
</body>
</html>
