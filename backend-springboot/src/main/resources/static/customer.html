    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        ::-webkit-scrollbar-thumb:hover { background: #aec9a4; }
        *:focus-visible { outline: 2px solid #1a936f; outline-offset: 2px; }
        .khqr-pattern {
            background-color: #ffffff;
            background-image: radial-gradient(#b4543d 1.5px, transparent 1.5px), radial-gradient(#114b5f 1.5px, #ffffff 1.5px);
            background-size: 14px 14px;
            background-position: 0 0, 7px 7px;
        }

</head>
<body class="min-h-screen bg-cream-50 text-ink-900 antialiased selection:bg-forest-500 selection:text-white">
<div id="root">
    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="text-center p-8 bg-white/80 backdrop-blur rounded-3xl border border-sage-200 shadow-xl max-w-sm">
            <div class="w-12 h-12 border-4 border-forest-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <h2 class="font-display font-bold text-xl text-ink-950 mb-1">Loading FoodEats Portal...</h2>
            <p class="text-xs text-ink-500 font-semibold">Connecting to Spring Boot Platform Engine</p>
        </div>
    </div>
</div>

<script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const API_BASE = "";

    const DEFAULT_CUSTOMERS = [
        {

                { id: 'a3', label: "University", address: "RUPP Campus 1, Russian Blvd, Phnom Penh", isDefault: false }
            ]
        }
    ];

    const INITIAL_RESTAURANTS = [
        {
            id: 1,
            name: "Zando Burger & Grill",
            cuisine: "Gourmet American",
            category: "Burgers",
            distance: "1.2 km",
            rating: 4.9,
            reviewsCount: 320,
            deliveryFee: 1.50,
            deliveryTime: "20 min",
            address: "Street 271, Sangkat Phsar Doeum Thkov, Phnom Penh",
            imageUrl: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&auto=format&fit=crop&q=80",
            description: "Juicy artisan smash burgers, crispy truffle fries, and premium thick milkshakes crafted daily.",
            menu: [
                { id: 101, name: "Double Truffle Smash Burger", price: 6.50, category: "Burgers", description: "2x 100% Angus beef patties, Swiss gruyere, black truffle aioli on brioche", imageUrl: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=400&auto=format&fit=crop&q=80" },
                { id: 102, name: "Smoky Bacon & Cheddar Burger", price: 5.90, category: "Burgers", description: "Crispy applewood smoked bacon, aged cheddar, caramelised onions, BBQ sauce", imageUrl: "https://images.unsplash.com/photo-1553979459-d2229ba7433b?w=400&auto=format&fit=crop&q=80" },
                { id: 103, name: "Golden Truffle Parmesan Fries", price: 2.75, category: "Sides", description: "Skin-on rustic russet fries tossed in white truffle oil and fresh shredded parmesan", imageUrl: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=400&auto=format&fit=crop&q=80" },
                { id: 104, name: "Salted Caramel Shake", price: 3.50, category: "Beverages", description: "Hand-spun French vanilla ice cream with artisanal sea salt caramel swirl", imageUrl: "https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=400&auto=format&fit=crop&q=80" }
            ]
        },
        {
            id: 2,
            name: "Sakura Sushi & Ramen Bar",
            cuisine: "Japanese Artisan",
            category: "Japanese",
            distance: "2.4 km",
            rating: 4.8,
            reviewsCount: 540,
            deliveryFee: 2.00,
            deliveryTime: "30 min",
            address: "St. 51 Pasteur, BKK1, Phnom Penh",
            imageUrl: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=600&auto=format&fit=crop&q=80",
            description: "Authentic Hakata tonkotsu ramen simmered for 18 hours, and fresh sashimi rolls.",
            menu: [
                { id: 201, name: "Signature Tonkotsu Black Ramen", price: 8.50, category: "Ramen", description: "Rich 18-hour pork broth, charred black garlic oil, tender chashu pork, and nitamago egg", imageUrl: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400&auto=format&fit=crop&q=80" },
                { id: 202, name: "Spicy Miso Ramen", price: 8.00, category: "Ramen", description: "Warming red miso broth with chili oil, ground seasoned pork, sweet corn, and scallions", imageUrl: "https://images.unsplash.com/photo-1618841557871-b4664fbf0cb3?w=400&auto=format&fit=crop&q=80" },
                { id: 203, name: "Salmon Aburi Dragon Roll (8pcs)", price: 9.20, category: "Sushi", description: "Seared Atlantic salmon over crispy prawn tempura roll with unagi reduction", imageUrl: "https://images.unsplash.com/photo-1617196034796-73dfa7b1fd56?w=400&auto=format&fit=crop&q=80" }
            ]
        },
        {
            id: 3,
            name: "Khmer Coffee & Patisserie",
            cuisine: "Café & Bakery",
            category: "Coffee & Bakery",
            distance: "0.8 km",
            rating: 4.9,
            reviewsCount: 410,
            deliveryFee: 1.00,
            deliveryTime: "15 min",
            address: "Norodom Blvd, Daun Penh, Phnom Penh",
            imageUrl: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=600&auto=format&fit=crop&q=80",
            description: "Mondulkiri specialty organic coffee beans, freshly baked French butter croissants, and iced condensed milk coffee.",
            menu: [
                { id: 301, name: "Mondulkiri Iced Latte", price: 2.20, category: "Coffee", description: "Double espresso shot with fresh milk and pure palm sugar syrup", imageUrl: "https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=400&auto=format&fit=crop&q=80" },
                { id: 302, name: "Almond Butter Croissant", price: 2.75, category: "Bakery", description: "Flaky golden croissant baked with roasted almond cream", imageUrl: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=400&auto=format&fit=crop&q=80" },
                { id: 303, name: "Iced Palm Sugar Milk Tea", price: 2.50, category: "Beverages", description: "Slow-brewed red tea infused with caramelized Kampot palm sugar", imageUrl: "https://images.unsplash.com/photo-1558857563-b37cf5429e31?w=400&auto=format&fit=crop&q=80" }
            ]
        }
    ];

    const INITIAL_ORDERS = [
        {
            id: 101,
            customerId: 'c1',
            merchant: "Zando Burger & Grill",
            merchantId: 1,
            items: "2x Double Truffle Smash Burger ($13.00)",
            itemsCount: 2,
            subtotal: 13.00,
            deliveryFee: 1.50,
            total: 14.50,
            status: "ACCEPTED",
            paymentStatus: "PAID_MOCK",
            time: "10m ago",
            driver: "Dara K. Express",
            address: "Building 42, St. 302, BKK1, Phnom Penh"
        }
    ];

    function CustomerApp() {
        // Authenticated user state
        const [authUser, setAuthUser] = useState(() => {
            const saved = localStorage.getItem('foodeats_auth_user');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.role === 'CUSTOMER') return parsed;
                } catch (e) {}
            }
            return DEFAULT_CUSTOMERS[0]; // Active default customer
        });

        // App state
        const [restaurants, setRestaurants] = useState(INITIAL_RESTAURANTS);
        const [selectedRestaurant, setSelectedRestaurant] = useState(null);
        const [selectedCategory, setSelectedCategory] = useState('ALL');
        const [searchQuery, setSearchQuery] = useState('');
        const [cart, setCart] = useState([]);
        const [orders, setOrders] = useState(INITIAL_ORDERS);
        const [activeView, setActiveView] = useState('discovery'); // 'discovery' | 'restaurant' | 'orders' | 'profile'

        // Modals
        const [showAuthModal, setShowAuthModal] = useState(false);
        const [authTab, setAuthTab] = useState('login'); // 'login' | 'register'
        const [showCartDrawer, setShowCartDrawer] = useState(false);
        const [showCheckoutModal, setShowCheckoutModal] = useState(false);
        const [showItemDetailModal, setShowItemDetailModal] = useState(null);
        const [selectedAddress, setSelectedAddress] = useState(() => {
            if (authUser && authUser.addresses && authUser.addresses.length > 0) {
                return authUser.addresses[0];
            }
            return { id: 'default', label: 'Default Delivery', address: 'Building 42, St. 302, BKK1, Phnom Penh' };
        });
        const [paymentMethod, setPaymentMethod] = useState('MOCK_KHQR');
        const [isProcessingPayment, setIsProcessingPayment] = useState(false);
        const [toast, setToast] = useState(null);

        // Auth Form States
        const [loginEmail, setLoginEmail] = useState('');
        const [loginPassword, setLoginPassword] = useState('');
        const [loginError, setLoginError] = useState('');

        const [regName, setRegName] = useState('');
        const [regEmail, setRegEmail] = useState('');
        const [regPhone, setRegPhone] = useState('');
        const [regPassword, setRegPassword] = useState('');
        const [regAddress, setRegAddress] = useState('');
        const [regError, setRegError] = useState('');

        const showToast = (msg, type = 'success') => {
            setToast({ msg, type });
            setTimeout(() => setToast(null), 3500);
        };

        // Fetch backend merchants on mount
        useEffect(() => {
            const fetchMerchants = async () => {
                try {
                    const res = await fetch(`${API_BASE}/api/merchants`);
                    if (res.ok) {
                        const data = await res.json();
                        if (Array.isArray(data) && data.length > 0) {
                            setRestaurants(data.map(m => ({
                                id: m.id,
                                name: m.name,
                                cuisine: m.cuisineType || m.category || "Gourmet Dining",
                                category: m.category || "General",
                                distance: "1.5 km",
                                rating: m.rating || 4.9,
                                reviewsCount: m.reviewsCount || 120,
                                deliveryFee: m.deliveryFee || 1.50,
                                deliveryTime: "25 min",
                                address: m.address || "Phnom Penh, Cambodia",
                                imageUrl: m.imageUrl || "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&auto=format&fit=crop&q=80",
                                description: m.description || "Authentic culinary favorites prepared fresh upon order.",
                                menu: m.menuItems || []
                            })));
                        }
                    }
                } catch (e) {
                    console.log("Using initial restaurant discovery data");
                }
            };
            fetchMerchants();
        }, []);

        useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
        }, [activeView, selectedRestaurant, cart, orders, showCartDrawer, showCheckoutModal, showAuthModal, authTab, showItemDetailModal, toast, authUser]);

        // Cart calculations (Strict backend-aligned pricing)
        const cartSubtotal = useMemo(() => {
            return cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        }, [cart]);

        const currentMerchant = useMemo(() => {
            if (cart.length === 0) return null;
            return restaurants.find(r => r.id === cart[0].merchantId) || restaurants[0];
        }, [cart, restaurants]);

        const cartDeliveryFee = currentMerchant ? (currentMerchant.deliveryFee || 1.50) : 0;
        const cartTotal = cartSubtotal > 0 ? (cartSubtotal + cartDeliveryFee) : 0;

        const handleAddToCart = (item, merchant) => {
            if (cart.length > 0 && cart[0].merchantId !== merchant.id) {
                if (!confirm(`Your cart already contains items from "${cart[0].merchantName}". Would you like to clear your cart and start a new order with "${merchant.name}"?`)) {
                    return;
                }
                setCart([{
                    id: item.id,
                    name: item.name,
                    price: item.price,
                    imageUrl: item.imageUrl,
                    merchantId: merchant.id,
                    merchantName: merchant.name,
                    quantity: 1
                }]);
                showToast(`Started new order from ${merchant.name}!`);
                return;
            }

            setCart(prev => {
                const existing = prev.find(i => i.id === item.id);
                if (existing) {
                    return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
                } else {
                    return [...prev, {
                        id: item.id,
                        name: item.name,
                        price: item.price,
                        imageUrl: item.imageUrl,
                        merchantId: merchant.id,
                        merchantName: merchant.name,
                        quantity: 1
                    }];
                }
            });
            showToast(`Added ${item.name} to cart!`);
        };

        const handleUpdateQuantity = (itemId, delta) => {
            setCart(prev => {
                return prev.map(item => {
                    if (item.id === itemId) {
                        const newQ = item.quantity + delta;
                        return newQ > 0 ? { ...item, quantity: newQ } : null;
                    }
                    return item;
                }).filter(Boolean);
            });
        };

        // Authentication Handlers
        const handleLoginSubmit = async (e) => {
            e.preventDefault();
            setLoginError('');

            const email = loginEmail.trim().toLowerCase();
            const password = loginPassword.trim();

            if (!email || !password) {
                setLoginError('Please provide both email and password.');
                return;
            }

            // Role-based redirection if Admin, Merchant, or Driver credentials used
            if (email === 'admin@example.com' || email.includes('admin')) {
                localStorage.setItem('foodeats_auth_user', JSON.stringify({ name: "Alex Admin", email, role: "ADMIN" }));
                showToast("Admin account identified. Redirecting to Admin Hub...", "info");
                setTimeout(() => window.location.href = 'admin.html', 1000);
                return;
            }
            if (email === 'merchant@example.com' || email.includes('merchant')) {
                localStorage.setItem('foodeats_auth_user', JSON.stringify({ name: "Bopha Culinary", email, role: "MERCHANT" }));
                showToast("Merchant account identified. Redirecting to Merchant Portal...", "info");
                setTimeout(() => window.location.href = 'merchant.html', 1000);
                return;
            }
            if (email === 'driver@example.com' || email.includes('driver')) {
                localStorage.setItem('foodeats_auth_user', JSON.stringify({ name: "Dara Express", email, role: "DRIVER" }));
                showToast("Driver account identified. Redirecting to Driver Dispatch...", "info");
                setTimeout(() => window.location.href = 'driver.html', 1000);
                return;
            }

            // Customer Login
            const customerUser = {
                id: 'c_' + Date.now(),
                name: email.split('@')[0].replace('.', ' ').replace(/\b\w/g, l => l.toUpperCase()),
                email: email,
                phone: "+855 12 345 678",
                role: "CUSTOMER",
                addresses: [
                    { id: 'a1', label: "Home (BKK1)", address: "Building 42, St. 302, BKK1, Phnom Penh", isDefault: true },
                    { id: 'a2', label: "Office", address: "Vattanac Tower Level 14, Phnom Penh", isDefault: false }
                ]
            };

            setAuthUser(customerUser);
            localStorage.setItem('foodeats_auth_user', JSON.stringify(customerUser));
            setShowAuthModal(false);
            showToast(`Welcome back, ${customerUser.name}!`);
        };

        const handleRegisterSubmit = async (e) => {
            e.preventDefault();
            setRegError('');

            if (!regName.trim() || !regEmail.trim() || !regPassword.trim()) {
                setRegError('Please complete all required fields.');
                return;
            }

            const newCustomer = {
                id: 'c_' + Date.now(),
                name: regName.trim(),
                email: regEmail.trim().toLowerCase(),
                phone: regPhone.trim() || "+855 12 888 999",
                role: "CUSTOMER",
                addresses: [
                    {
                        id: 'a_' + Date.now(),
                        label: "Default Address",
                        address: regAddress.trim() || "Phnom Penh, Cambodia",
                        isDefault: true
                    }
                ]
            };

            setAuthUser(newCustomer);
            localStorage.setItem('foodeats_auth_user', JSON.stringify(newCustomer));
            setSelectedAddress(newCustomer.addresses[0]);
            setShowAuthModal(false);
            showToast(`Account created! Welcome to FoodEats, ${newCustomer.name}!`);
        };

        const handleLogout = () => {
            localStorage.removeItem('foodeats_auth_token');
            localStorage.removeItem('foodeats_auth_user');
            setAuthUser(null);
            showToast("You have been signed out.", "info");
        };

        const handleProceedToCheckout = () => {
            if (!authUser) {
                setShowCartDrawer(false);
                setAuthTab('login');
                setShowAuthModal(true);
                showToast("Please sign in or register to place your order.", "info");
                return;
            }
            setShowCartDrawer(false);
            setShowCheckoutModal(true);
        };

        const handleConfirmPayment = () => {
            setIsProcessingPayment(true);
            setTimeout(() => {
                const newOrder = {
                    id: 100 + orders.length + 1,
                    customerId: authUser ? authUser.id : 'guest',
                    customerName: authUser ? authUser.name : 'Customer',
                    merchant: currentMerchant.name,
                    merchantId: currentMerchant.id,
                    items: cart.map(i => `${i.quantity}x ${i.name}`).join(", "),
                    itemsCount: cart.reduce((s, i) => s + i.quantity, 0),
                    subtotal: cartSubtotal,
                    deliveryFee: cartDeliveryFee,
                    total: cartTotal,
                    status: "ACCEPTED",
                    paymentStatus: "PAID_MOCK",
                    time: "Just now",
                    driver: "Dara K. Express (Auto-assigned)",
                    address: selectedAddress ? selectedAddress.address : "Phnom Penh, Cambodia"
                };

                setOrders([newOrder, ...orders]);
                setCart([]);
                setIsProcessingPayment(false);
                setShowCheckoutModal(false);
                setActiveView('orders');
                showToast("Order placed successfully! Kitchen is preparing your meal.");
            }, 1800);
        };

        // Filtered restaurants
        const filteredRestaurants = useMemo(() => {
            return restaurants.filter(r => {
                const matchCategory = selectedCategory === 'ALL' || r.category.toLowerCase().includes(selectedCategory.toLowerCase()) || r.cuisine.toLowerCase().includes(selectedCategory.toLowerCase());
                const matchSearch = !searchQuery || r.name.toLowerCase().includes(searchQuery.toLowerCase()) || r.cuisine.toLowerCase().includes(searchQuery.toLowerCase()) || r.menu.some(m => m.name.toLowerCase().includes(searchQuery.toLowerCase()));
                return matchCategory && matchSearch;
            });
        }, [restaurants, selectedCategory, searchQuery]);

        const categoriesList = ['ALL', 'Burgers', 'Japanese', 'Coffee & Bakery', 'Khmer', 'Desserts'];

        return (
            <div className="min-h-screen flex flex-col bg-cream-50">
                {/* Toast Notification */}
                {toast && (
                    <div className="fixed top-5 right-5 z-50 px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 border text-sm font-semibold bg-ink-950 text-mint-300 border-forest-700 animate-bounce">
                        <i data-lucide={toast.type === 'info' ? 'info' : 'check-circle-2'} className="w-5 h-5 text-mint-400"></i>
                        {toast.msg}
                    </div>
                )}

                {/* Top Guest / Welcome Alert Banner */}
                {!authUser && (
                    <div className="bg-gradient-to-r from-forest-700 via-forest-600 to-ink-900 text-white px-4 py-2 text-xs font-semibold flex items-center justify-between shadow-sm">
                        <div className="flex items-center gap-2 max-w-2xl truncate">
                            <span className="bg-mint-400 text-ink-950 px-2 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider">Guest Mode</span>
                            <span>Sign in or create a Customer account to save delivery addresses and track live orders!</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => { setAuthTab('login'); setShowAuthModal(true); }}
                                className="px-3 py-1 bg-white/20 hover:bg-white/30 rounded-lg text-white font-bold transition text-xs"
                            >
                                Log In
                            </button>
                            <button
                                onClick={() => { setAuthTab('register'); setShowAuthModal(true); }}
                                className="px-3 py-1 bg-mint-400 hover:bg-mint-300 text-ink-950 rounded-lg font-bold transition text-xs shadow"
                            >
                                Register
                            </button>
                        </div>
                    </div>
                )}

                {/* Main Header / Navigation Bar */}
                <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-sage-200 shadow-sm">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between gap-4">

                        {/* Brand Logo & Tagline */}

                                                </div>
                                                <div className="w-full h-2 bg-sage-100 rounded-full overflow-hidden">
                                                    <div className="h-full bg-gradient-to-r from-forest-500 to-mint-400 rounded-full" style={{ width: order.status === 'DELIVERED' ? '100%' : '50%' }}></div>
                                                </div>
                                            </div>

                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* VIEW 4: USER PROFILE & ADDRESS BOOK */}
                    {activeView === 'profile' && authUser && (
                        <div className="max-w-2xl mx-auto space-y-6">
                            <div className="bg-white rounded-3xl border border-sage-200 p-6 shadow-sm space-y-6">
                                <div className="flex items-center justify-between pb-4 border-b border-sage-100">
                                    <div className="flex items-center gap-3">
                                        <div className="w-12 h-12 rounded-2xl bg-forest-600 text-white flex items-center justify-center font-black text-xl">
                                            {authUser.name.charAt(0)}
                                        </div>
                                        <div>
                                            <h2 className="font-display font-bold text-xl text-ink-950">{authUser.name}</h2>
                                            <span className="text-xs font-semibold text-ink-500">{authUser.email} • {authUser.phone}</span>
                                        </div>
                                    </div>
                                    <span className="px-3 py-1 rounded-full bg-forest-50 text-forest-700 font-black text-xs border border-forest-200">
                                        Active Customer
                                    </span>
                                </div>

                                {/* Saved Addresses (US-004) */}
                                <div className="space-y-3">
                                    <div className="flex items-center justify-between">
                                        <h3 className="font-display font-bold text-base text-ink-950">Saved Delivery Addresses (US-004)</h3>
                                    </div>
                                    <div className="space-y-2.5">
                                        {authUser.addresses && authUser.addresses.map(addr => (
                                            <div
                                                key={addr.id}
                                                onClick={() => {
                                                    setSelectedAddress(addr);
                                                    showToast(`Selected "${addr.label}" as active delivery location`);
                                                }}
                                                className={`p-3.5 rounded-2xl border transition cursor-pointer flex items-center justify-between ${selectedAddress && selectedAddress.id === addr.id ? 'bg-forest-50 border-forest-500 ring-2 ring-forest-500/20' : 'bg-white hover:bg-sage-50 border-sage-200'}`}
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className="w-8 h-8 rounded-xl bg-forest-100 text-forest-700 flex items-center justify-center">
                                                        <i data-lucide="map-pin" className="w-4 h-4"></i>
                                                    </div>
                                                    <div>
                                                        <div className="text-xs font-bold text-ink-950 flex items-center gap-2">
                                                            <span>{addr.label}</span>
                                                            {addr.isDefault && (
                                                                <span className="text-[9px] font-black bg-cream-200 text-ink-800 px-1.5 py-0.5 rounded">Default</span>
                                                            )}
                                                        </div>
                                                        <p className="text-xs text-ink-500">{addr.address}</p>
                                                    </div>
                                                </div>
                                                <i data-lucide={selectedAddress && selectedAddress.id === addr.id ? "check-circle" : "circle"} className={`w-4 h-4 ${selectedAddress && selectedAddress.id === addr.id ? 'text-forest-600' : 'text-sage-300'}`}></i>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Sign Out Action */}
                                <div className="pt-4 border-t border-sage-100 flex items-center justify-between">
                                    <button
                                        onClick={handleLogout}
                                        className="px-4 py-2 bg-rust-500/10 hover:bg-rust-500/20 text-rust-600 rounded-2xl text-xs font-bold transition flex items-center gap-2"
                                    >
                                        <i data-lucide="log-out" className="w-4 h-4"></i>
                                        <span>Sign Out</span>
                                    </button>
                                    <button
                                        onClick={() => { setActiveView('discovery'); setSelectedRestaurant(null); }}
                                        className="px-4 py-2 bg-forest-600 hover:bg-forest-700 text-white rounded-2xl text-xs font-bold transition"
                                    >
                                        Return to Food Discovery
                                    </button>
                                </div>

                            </div>
                        </div>
                    )}

                </main>

                {/* CART DRAWER / SIDEBAR */}
                {showCartDrawer && (
                    <div className="fixed inset-0 z-50 overflow-hidden">
                        <div className="absolute inset-0 bg-ink-950/60 backdrop-blur-sm transition-opacity" onClick={() => setShowCartDrawer(false)}></div>
                        <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
                            <div className="w-screen max-w-md bg-white shadow-2xl flex flex-col justify-between">

                                {/* Cart Header */}
                                <div className="p-6 border-b border-sage-200 flex items-center justify-between">
                                    <div className="flex items-center gap-2.5">
                                        <div className="w-9 h-9 rounded-xl bg-forest-100 text-forest-700 flex items-center justify-center font-black">
                                            <i data-lucide="shopping-bag" className="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <h2 className="font-display font-bold text-lg text-ink-950">Your Cart</h2>
                                            <span className="text-[11px] font-semibold text-ink-500">{currentMerchant ? currentMerchant.name : 'No items added'}</span>
                                        </div>
                                    </div>
                                    <button onClick={() => setShowCartDrawer(false)} className="p-2 hover:bg-sage-100 rounded-full text-ink-400 hover:text-ink-900 transition">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                {/* Cart Items */}
                                <div className="p-6 flex-1 overflow-y-auto space-y-4">
                                    {cart.length === 0 ? (
                                        <div className="text-center py-12 space-y-3">
                                            <div className="w-14 h-14 rounded-full bg-sage-100 text-sage-400 flex items-center justify-center mx-auto">
                                                <i data-lucide="shopping-cart" className="w-6 h-6"></i>
                                            </div>
                                            <h4 className="font-display font-bold text-ink-900">Your basket is empty</h4>
                                            <p className="text-xs text-ink-500">Add dishes from our menu to start your order.</p>
                                        </div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.id} className="p-3.5 rounded-2xl bg-cream-50/70 border border-sage-200 flex items-center justify-between gap-3">
                                                <div className="flex-1">
                                                    <h4 className="text-xs font-bold text-ink-950">{item.name}</h4>
                                                    <span className="text-xs font-black text-forest-700">${(item.price * item.quantity).toFixed(2)}</span>
                                                </div>
                                                <div className="flex items-center gap-2 bg-white border border-sage-200 rounded-xl px-2 py-1">
                                                    <button onClick={() => handleUpdateQuantity(item.id, -1)} className="w-5 h-5 flex items-center justify-center font-black text-ink-600 hover:text-rust-600">-</button>
                                                    <span className="text-xs font-bold w-4 text-center">{item.quantity}</span>
                                                    <button onClick={() => handleUpdateQuantity(item.id, 1)} className="w-5 h-5 flex items-center justify-center font-black text-ink-600 hover:text-forest-600">+</button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {/* Cart Summary & Checkout */}
                                {cart.length > 0 && (
                                    <div className="p-6 bg-cream-50 border-t border-sage-200 space-y-4">
                                        <div className="space-y-1.5 text-xs">
                                            <div className="flex justify-between text-ink-600">
                                                <span>Subtotal</span>
                                                <span className="font-bold text-ink-950">${cartSubtotal.toFixed(2)}</span>
                                            </div>
                                            <div className="flex justify-between text-ink-600">
                                                <span>Delivery Fee</span>
                                                <span className="font-bold text-ink-950">${cartDeliveryFee.toFixed(2)}</span>
                                            </div>
                                            <div className="flex justify-between text-sm font-black text-ink-950 pt-2 border-t border-sage-200">
                                                <span>Total</span>
                                                <span className="text-forest-700 font-display text-base">${cartTotal.toFixed(2)}</span>
                                            </div>
                                        </div>

                                        <button
                                            onClick={handleProceedToCheckout}
                                            className="w-full py-3.5 bg-forest-600 hover:bg-forest-700 text-white rounded-2xl text-xs font-bold shadow-lg shadow-forest-600/30 transition flex items-center justify-center gap-2"
                                        >
                                            <i data-lucide="lock" className="w-4 h-4 text-mint-300"></i>
                                            <span>Proceed to Checkout (${cartTotal.toFixed(2)})</span>
                                        </button>
                                    </div>
                                )}

                            </div>
                        </div>
                    </div>
                )}

                {/* CHECKOUT & MOCK KHQR PAYMENT MODAL */}
                {showCheckoutModal && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                        <div className="fixed inset-0 bg-ink-950/70 backdrop-blur-sm" onClick={() => setShowCheckoutModal(false)}></div>
                        <div className="relative bg-white rounded-3xl border border-sage-200 max-w-lg w-full p-6 sm:p-8 shadow-2xl space-y-6 z-10">

                            <div className="flex items-center justify-between pb-4 border-b border-sage-100">
                                <div>
                                    <h3 className="font-display font-bold text-xl text-ink-950">Mock Payment & Checkout</h3>
                                    <span className="text-xs font-semibold text-ink-500">Sprint 4 Payment Service Module</span>
                                </div>
                                <button onClick={() => setShowCheckoutModal(false)} className="p-2 hover:bg-sage-100 rounded-full text-ink-400">
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>
                            </div>

                            {/* Destination */}
                            <div className="p-3.5 bg-cream-50 rounded-2xl border border-sage-200 space-y-1 text-xs">
                                <span className="font-bold text-ink-400 uppercase text-[10px]">Delivering to:</span>
                                <div className="font-bold text-ink-950">{selectedAddress ? selectedAddress.address : "Phnom Penh, Cambodia"}</div>
                            </div>

                            {/* Payment Method Selector */}
                            <div className="space-y-2">
                                <label className="text-xs font-bold text-ink-700">Select Mock Payment Method:</label>
                                <div className="grid grid-cols-2 gap-3">
                                    <button
                                        type="button"
                                        onClick={() => setPaymentMethod('MOCK_KHQR')}
                                        className={`p-3 rounded-2xl border text-xs font-bold flex flex-col items-center gap-1.5 transition ${paymentMethod === 'MOCK_KHQR' ? 'bg-rust-500/10 border-rust-500 text-rust-700' : 'bg-white border-sage-200 text-ink-700'}`}
                                    >
                                        <i data-lucide="qr-code" className="w-5 h-5 text-rust-600"></i>
                                        <span>Bakong / KHQR</span>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setPaymentMethod('MOCK_CARD')}
                                        className={`p-3 rounded-2xl border text-xs font-bold flex flex-col items-center gap-1.5 transition ${paymentMethod === 'MOCK_CARD' ? 'bg-forest-50 border-forest-500 text-forest-700' : 'bg-white border-sage-200 text-ink-700'}`}
                                    >
                                        <i data-lucide="credit-card" className="w-5 h-5 text-forest-600"></i>
                                        <span>Visa / Mastercard</span>
                                    </button>
                                </div>
                            </div>

                            {/* KHQR Visual Pattern */}
                            {paymentMethod === 'MOCK_KHQR' && (
                                <div className="p-4 bg-rust-500/5 rounded-2xl border border-rust-500/20 text-center space-y-2">
                                    <div className="w-32 h-32 mx-auto rounded-xl khqr-pattern border-2 border-rust-500 p-2 shadow-inner flex items-center justify-center">
                                        <span className="bg-white/90 px-2 py-1 rounded text-[9px] font-black text-rust-700 uppercase tracking-widest border border-rust-300">KHQR TEST</span>
                                    </div>
                                    <span className="text-[11px] font-bold text-rust-700 block">Simulated National KHQR Stand-in</span>
                                </div>
                            )}

                            {/* Payment Summary */}
                            <div className="flex items-center justify-between p-4 bg-forest-50 rounded-2xl border border-forest-200 text-sm font-black text-ink-950">
                                <span>Grand Total:</span>
                                <span className="font-display text-xl text-forest-700">${cartTotal.toFixed(2)}</span>
                            </div>

                            {/* Submit Payment */}
                            <button
                                onClick={handleConfirmPayment}
                                disabled={isProcessingPayment}
                                className="w-full py-3.5 bg-forest-600 hover:bg-forest-700 text-white rounded-2xl text-xs font-bold shadow-lg transition flex items-center justify-center gap-2 disabled:opacity-50"
                            >
                                {isProcessingPayment ? (
                                    <>
                                        <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                                        <span>Verifying Mock Settlement...</span>
                                    </>
                                ) : (
                                    <>
                                        <i data-lucide="check" className="w-4 h-4"></i>
                                        <span>Confirm Mock Payment & Place Order</span>
                                    </>
                                )}
                            </button>

                        </div>
                    </div>
                )}

                {/* AUTHENTICATION MODAL (SIGN IN / REGISTER TABS) */}
                {showAuthModal && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                        <div className="fixed inset-0 bg-ink-950/70 backdrop-blur-sm" onClick={() => setShowAuthModal(false)}></div>
                        <div className="relative bg-white rounded-3xl border border-sage-200 max-w-md w-full p-6 sm:p-8 shadow-2xl space-y-6 z-10">

                            {/* Modal Header */}
                            <div className="flex items-center justify-between pb-3 border-b border-sage-100">
                                <div>
                                    <h3 className="font-display font-bold text-xl text-ink-950">
                                        {authTab === 'login' ? 'Customer Sign In / Log In' : 'Create Customer Account'}
                                    </h3>
                                    <span className="text-xs font-semibold text-ink-500">Access personalized orders and saved addresses</span>
                                </div>
                                <button onClick={() => setShowAuthModal(false)} className="p-2 hover:bg-sage-100 rounded-full text-ink-400">
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>
                            </div>

                            {/* Tab Switcher */}
                            <div className="flex p-1 bg-cream-100 rounded-2xl border border-sage-200 text-xs font-bold">
                                <button
                                    onClick={() => { setAuthTab('login'); setLoginError(''); }}
                                    className={`flex-1 py-2 rounded-xl transition ${authTab === 'login' ? 'bg-white text-ink-950 shadow-sm' : 'text-ink-600 hover:text-ink-950'}`}
                                >
                                    Log In / Sign In
                                </button>
                                <button
                                    onClick={() => { setAuthTab('register'); setRegError(''); }}
                                    className={`flex-1 py-2 rounded-xl transition ${authTab === 'register' ? 'bg-white text-ink-950 shadow-sm' : 'text-ink-600 hover:text-ink-950'}`}
                                >
                                    Register Account
                                </button>
                            </div>

                            {/* TAB 1: LOG IN */}
                            {authTab === 'login' && (
                                <form onSubmit={handleLoginSubmit} className="space-y-4">
                                    {loginError && (
                                        <div className="p-3 rounded-xl bg-rust-500/10 border border-rust-500/30 text-xs font-semibold text-rust-600 flex items-center gap-2">
                                            <i data-lucide="alert-circle" className="w-4 h-4 shrink-0"></i>
                                            <span>{loginError}</span>
                                        </div>
                                    )}

                                    <div>
                                        <label className="block text-xs font-bold text-ink-700 mb-1.5">Email Address</label>
                                        <input
                                            type="email"
                                            required
                                            value={loginEmail}
                                            onChange={e => setLoginEmail(e.target.value)}
                                            placeholder="customer@example.com"
                                            className="w-full bg-cream-50/70 border border-sage-200 rounded-2xl px-3.5 py-2.5 text-xs font-semibold text-ink-900 focus:outline-none focus:border-forest-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-ink-700 mb-1.5">Password</label>
                                        <input
                                            type="password"
                                            required
                                            value={loginPassword}
                                            onChange={e => setLoginPassword(e.target.value)}
                                            placeholder="••••••••"
                                            className="w-full bg-cream-50/70 border border-sage-200 rounded-2xl px-3.5 py-2.5 text-xs font-semibold text-ink-900 focus:outline-none focus:border-forest-500"
                                        />
                                    </div>

                                    {/* Quick Fill Button */}
                                    <div className="flex items-center justify-between text-xs pt-1">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setLoginEmail('customer@example.com');
                                                setLoginPassword('password123');
                                            }}
                                            className="text-forest-700 hover:text-forest-800 font-bold underline"
                                        >
                                            ⚡ Auto-fill Customer Demo Login
                                        </button>
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full py-3 bg-forest-600 hover:bg-forest-700 text-white rounded-2xl text-xs font-bold transition shadow-md flex items-center justify-center gap-2"
                                    >
                                        <i data-lucide="log-in" className="w-4 h-4"></i>
                                        <span>Sign In as Customer</span>
                                    </button>
                                </form>
                            )}

                            {/* TAB 2: REGISTER */}
                            {authTab === 'register' && (
                                <form onSubmit={handleRegisterSubmit} className="space-y-3.5">
                                    {regError && (
                                        <div className="p-3 rounded-xl bg-rust-500/10 border border-rust-500/30 text-xs font-semibold text-rust-600 flex items-center gap-2">
                                            <i data-lucide="alert-circle" className="w-4 h-4 shrink-0"></i>
                                            <span>{regError}</span>
                                        </div>
                                    )}

                                    <div>
                                        <label className="block text-xs font-bold text-ink-700 mb-1">Full Name</label>
                                        <input
                                            type="text"
                                            required
                                            value={regName}
                                            onChange={e => setRegName(e.target.value)}
                                            placeholder="Sokha Mean"
                                            className="w-full bg-cream-50/70 border border-sage-200 rounded-2xl px-3.5 py-2 text-xs font-semibold text-ink-900 focus:outline-none focus:border-forest-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-ink-700 mb-1">Email Address</label>
                                        <input
                                            type="email"
                                            required
                                            value={regEmail}
                                            onChange={e => setRegEmail(e.target.value)}
                                            placeholder="sokha@example.com"
                                            className="w-full bg-cream-50/70 border border-sage-200 rounded-2xl px-3.5 py-2 text-xs font-semibold text-ink-900 focus:outline-none focus:border-forest-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-ink-700 mb-1">Phone Number</label>
                                        <input
                                            type="tel"
                                            value={regPhone}
                                            onChange={e => setRegPhone(e.target.value)}
                                            placeholder="+855 12 345 678"
                                            className="w-full bg-cream-50/70 border border-sage-200 rounded-2xl px-3.5 py-2 text-xs font-semibold text-ink-900 focus:outline-none focus:border-forest-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-ink-700 mb-1">Delivery Address</label>
                                        <input
                                            type="text"
                                            value={regAddress}
                                            onChange={e => setRegAddress(e.target.value)}
                                            placeholder="Building 42, St. 302, BKK1, Phnom Penh"
                                            className="w-full bg-cream-50/70 border border-sage-200 rounded-2xl px-3.5 py-2 text-xs font-semibold text-ink-900 focus:outline-none focus:border-forest-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-ink-700 mb-1">Password</label>
                                        <input
                                            type="password"
                                            required
                                            value={regPassword}
                                            onChange={e => setRegPassword(e.target.value)}
                                            placeholder="••••••••"
                                            className="w-full bg-cream-50/70 border border-sage-200 rounded-2xl px-3.5 py-2 text-xs font-semibold text-ink-900 focus:outline-none focus:border-forest-500"
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full py-3 bg-forest-600 hover:bg-forest-700 text-white rounded-2xl text-xs font-bold transition shadow-md flex items-center justify-center gap-2"
                                    >
                                        <i data-lucide="user-plus" className="w-4 h-4"></i>
                                        <span>Complete Registration</span>
                                    </button>
                                </form>
                            )}

                        </div>
                    </div>
                )}

            </div>
        );
    }

    ReactDOM.render(<CustomerApp />, document.getElementById('root'));
</script>
</body>
</html>
