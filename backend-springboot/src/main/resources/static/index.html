<!DOCTYPE html>
<html lang="en" class="h-full bg-cream-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodEats - Smart Food Delivery Mobile & Web Ecosystem</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: {
                            50: '#eef4f5', 100: '#d7e6e9', 200: '#adc9cf', 300: '#7ea9b3',
                            400: '#4c8593', 500: '#2c6575', 600: '#1c5164', 700: '#16455a',
                            800: '#114b5f', 900: '#0d3b4b', 950: '#082530'
                        },
                        forest: {
                            50: '#eefaf5', 100: '#d3f2e3', 200: '#a7e5c8', 300: '#72d1a8',
                            400: '#3fb686', 500: '#1a936f', 600: '#157a5c', 700: '#12634c',
                            800: '#114f3f', 900: '#0f4235', 950: '#08251e'
                        },
                        mint: {
                            50: '#f4faf6', 100: '#e1f5e8', 200: '#c3ebd2', 300: '#a2e0b9',
                            400: '#88d498', 500: '#63bf79', 600: '#47a25e', 700: '#38814c',
                            800: '#2f673f', 900: '#295536'
                        },
                        sage: {
                            50: '#f7faf5', 100: '#eef3e9', 200: '#dde9d4', 300: '#c6dabf',
                            400: '#aec9a4', 500: '#93b487', 600: '#75986a', 700: '#5c7a54',
                            800: '#4b6345', 900: '#3f523a'
                        },
                        cream: {
                            50: '#fdfbf7', 100: '#f8f2e6', 200: '#f3e9d2', 300: '#e9d8b4',
                            400: '#dcc48f', 500: '#ceaf6c', 600: '#b5924e', 700: '#927540'
                        },
                        rust: { 500: '#b4543d', 600: '#96422f', 900: '#3d1a13' }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Fraunces', 'serif']
                    }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-display { font-family: 'Fraunces', serif; font-feature-settings: 'ss01'; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f8f2e6; }
        ::-webkit-scrollbar-thumb { background: #c6dabf; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #aec9a4; }
        *:focus-visible { outline: 2px solid #1a936f; outline-offset: 2px; }
    </style>
</head>
<body class="min-h-screen bg-cream-50 text-ink-900 antialiased selection:bg-forest-500 selection:text-white">
<div id="root">
    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="text-center p-8 bg-white/80 backdrop-blur rounded-3xl border border-sage-200 shadow-xl max-w-sm">
            <div class="w-12 h-12 border-4 border-forest-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <h2 class="font-display font-bold text-xl text-ink-950 mb-1">Loading FoodEats Gateway...</h2>
            <p class="text-xs text-ink-500 font-semibold">Connecting to Spring Boot Platform Engine</p>
        </div>
    </div>
</div>

<script type="text/babel">
    const { useState, useEffect } = React;

    function PlatformGateway() {
        const [showAuthModal, setShowAuthModal] = useState(false);
        const [authEmail, setAuthEmail] = useState('');
        const [authPassword, setAuthPassword] = useState('');
        const [authError, setAuthError] = useState('');
        const [authTab, setAuthTab] = useState('login'); // 'login' | 'register'
        const [toast, setToast] = useState(null);

        // Registration fields
        const [regName, setRegName] = useState('');
        const [regEmail, setRegEmail] = useState('');
        const [regPassword, setRegPassword] = useState('');
        const [regPhone, setRegPhone] = useState('');
        const [regAddress, setRegAddress] = useState('');

        const showToast = (msg, type = 'success') => {
            setToast({ msg, type });
            setTimeout(() => setToast(null), 3500);
        };

        useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
        }, [showAuthModal, authTab, toast]);

        const handleLoginSubmit = (e) => {
            e.preventDefault();
            setAuthError('');
            const email = authEmail.trim().toLowerCase();

            if (!email || !authPassword.trim()) {
                setAuthError('Please enter both email and password.');
                return;
            }

            // Automatic Role-Based Routing
            if (email === 'admin@example.com' || email.includes('admin')) {
                localStorage.setItem('foodeats_auth_user', JSON.stringify({ name: "Alex Admin", email, role: "ADMIN" }));
                showToast("Admin authenticated. Redirecting to Admin Hub...", "info");
                setTimeout(() => window.location.href = 'admin.html', 800);
                return;
            }

            if (email === 'merchant@example.com' || email.includes('merchant')) {
                localStorage.setItem('foodeats_auth_user', JSON.stringify({ name: "Bopha Culinary Co.", email, role: "MERCHANT" }));
                showToast("Merchant authenticated. Redirecting to Merchant Kitchen...", "info");
                setTimeout(() => window.location.href = 'merchant.html', 800);
                return;
            }

            if (email === 'driver@example.com' || email.includes('driver')) {
                localStorage.setItem('foodeats_auth_user', JSON.stringify({ name: "Dara K. Express", email, role: "DRIVER" }));
                showToast("Driver authenticated. Redirecting to Driver Dispatch...", "info");
                setTimeout(() => window.location.href = 'driver.html', 800);
                return;
            }

            // Customer
            const customer = {
                id: 'c_' + Date.now(),
                name: email.split('@')[0].replace('.', ' ').replace(/\b\w/g, l => l.toUpperCase()),
                email,
                role: "CUSTOMER",
                addresses: [{ id: 'a1', label: "Home (BKK1)", address: "Building 42, St. 302, BKK1, Phnom Penh", isDefault: true }]
            };
            localStorage.setItem('foodeats_auth_user', JSON.stringify(customer));
            showToast("Customer authenticated. Redirecting to Customer Portal...", "info");
            setTimeout(() => window.location.href = 'customer.html', 800);
        };

        const handleRegisterSubmit = (e) => {
            e.preventDefault();
            if (!regName.trim() || !regEmail.trim() || !regPassword.trim()) {
                setAuthError('Please complete all required fields.');
                return;
            }

            const customer = {
                id: 'c_' + Date.now(),
                name: regName.trim(),
                email: regEmail.trim().toLowerCase(),
                phone: regPhone.trim() || "+855 12 345 678",
                role: "CUSTOMER",
                addresses: [{ id: 'a1', label: "Default Address", address: regAddress.trim() || "Phnom Penh, Cambodia", isDefault: true }]
            };
            localStorage.setItem('foodeats_auth_user', JSON.stringify(customer));
            showToast("Account created successfully! Redirecting to Customer Portal...", "info");
            setTimeout(() => window.location.href = 'customer.html', 800);
        };

        return (
            <div className="min-h-screen flex flex-col bg-cream-50 text-ink-900">
                {/* Toast Notification */}
                {toast && (
                    <div className="fixed top-5 right-5 z-50 px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 border text-sm font-semibold bg-ink-950 text-mint-300 border-forest-700 animate-bounce">
                        <i data-lucide="check-circle-2" className="w-5 h-5 text-mint-400"></i>
                        {toast.msg}
                    </div>
                )}

                {/* Platform Header */}
                <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-sage-200 shadow-sm">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between">

                        {/* Logo */}
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-2xl bg-forest-500 flex items-center justify-center text-white font-black text-xl shadow-md shadow-forest-500/30">
                                <i data-lucide="utensils" className="w-5 h-5"></i>
                            </div>
                            <div>
                                <div className="flex items-center gap-2">
                                    <span className="font-display font-black text-xl tracking-tight text-ink-950">FoodEats</span>
                                    <span className="px-2 py-0.5 rounded-full bg-forest-100 text-forest-800 text-[10px] font-extrabold border border-forest-200">Full Platform</span>
                                </div>
                                <span className="text-[11px] font-semibold text-ink-400 block -mt-1">Spring Boot & Kotlin Delivery System</span>
                            </div>
                        </div>

                        {/* Navigation Actions */}
                        <div className="flex items-center gap-3">
                            <a
                                href="customer.html"
                                className="px-4 py-2 bg-forest-50 hover:bg-forest-100 text-forest-700 border border-forest-200 rounded-2xl text-xs font-bold transition flex items-center gap-2"
                            >
                                <i data-lucide="shopping-bag" className="w-4 h-4 text-forest-600"></i>
                                <span>Go to Customer App</span>
                            </a>
                            <button
                                onClick={() => { setAuthTab('login'); setShowAuthModal(true); }}
                                className="px-4 py-2 bg-forest-600 hover:bg-forest-700 text-white rounded-2xl text-xs font-bold transition shadow-md shadow-forest-600/20 flex items-center gap-2"
                            >
                                <i data-lucide="log-in" className="w-4 h-4"></i>
                                <span>Sign In / Log In</span>
                            </button>
                            <button
                                onClick={() => { setAuthTab('register'); setShowAuthModal(true); }}
                                className="hidden sm:flex px-4 py-2 bg-white hover:bg-sage-100 text-ink-800 border border-sage-300 rounded-2xl text-xs font-bold transition items-center gap-2"
                            >
                                <i data-lucide="user-plus" className="w-4 h-4 text-forest-600"></i>
                                <span>Register</span>
                            </button>
                        </div>
                    </div>
                </header>

                {/* Hero Section */}
                <section className="py-12 md:py-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
                    <div className="relative rounded-3xl overflow-hidden bg-gradient-to-br from-ink-950 via-forest-900 to-ink-900 text-white p-8 md:p-16 shadow-2xl border border-ink-800">
                        <div className="relative z-10 max-w-3xl space-y-6">
                            <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-forest-500/20 border border-forest-400/30 text-mint-300 text-xs font-bold">
                                <i data-lucide="sparkles" className="w-4 h-4 text-mint-400"></i>
                                <span>Sprint 1–6 Agile System Delivery Hub</span>
                            </div>
                            <h1 className="font-display font-black text-3xl sm:text-5xl lg:text-6xl text-white tracking-tight leading-tight">
                                Smart Food Delivery Ecosystem
                            </h1>
                            <p className="text-mint-100/90 text-sm sm:text-base md:text-lg font-medium leading-relaxed">
                                Complete multi-role platform linking Customers, Merchants, Delivery Couriers, and System Administrators in a unified Spring Boot & Kotlin architecture.
                            </p>
                            <div className="pt-2 flex flex-wrap items-center gap-4">
                                <a
                                    href="customer.html"
                                    className="px-6 py-3.5 bg-mint-400 hover:bg-mint-300 text-ink-950 rounded-2xl text-xs sm:text-sm font-black shadow-lg shadow-mint-400/30 transition flex items-center gap-2"
                                >
                                    <i data-lucide="utensils" className="w-4 h-4"></i>
                                    <span>Launch Customer Discovery</span>
                                </a>
                                <button
                                    onClick={() => { setAuthTab('login'); setShowAuthModal(true); }}
                                    className="px-6 py-3.5 bg-white/10 hover:bg-white/20 text-white border border-white/20 rounded-2xl text-xs sm:text-sm font-bold backdrop-blur transition flex items-center gap-2"
                                >
                                    <i data-lucide="key" className="w-4 h-4 text-mint-300"></i>
                                    <span>Single-Form Sign In</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                {/* Four Distinct Role Portal Cards */}
                <section className="py-6 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full space-y-6">
                    <div>
                        <h2 className="font-display font-bold text-2xl sm:text-3xl text-ink-950">Select Your Role Portal</h2>
                        <p className="text-xs sm:text-sm font-semibold text-ink-500">Each role is protected by Spring Boot JWT authorization and strict role-based access control</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

                        {/* 1. Customer Card */}
                        <a
                            href="customer.html"
                            className="group bg-white rounded-3xl border border-sage-200 p-6 hover:border-forest-400 hover:shadow-xl transition-all duration-300 flex flex-col justify-between"
                        >
                            <div className="space-y-4">
                                <div className="w-12 h-12 rounded-2xl bg-forest-50 text-forest-700 border border-forest-200 flex items-center justify-center font-black group-hover:bg-forest-600 group-hover:text-white transition">
                                    <i data-lucide="shopping-bag" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <span className="text-[10px] font-black uppercase tracking-wider text-forest-700 bg-forest-50 px-2 py-0.5 rounded">Sprint 1, 3, 4</span>
                                    <h3 className="font-display font-bold text-xl text-ink-950 mt-1">Customer Portal</h3>
                                    <p className="text-xs text-ink-500 mt-1 leading-relaxed">
                                        Browse artisan restaurants, manage your shopping cart, complete mock payments, and track live deliveries.
                                    </p>
                                </div>
                            </div>
                            <div className="pt-6 mt-4 border-t border-sage-100 flex items-center justify-between text-xs font-bold text-forest-700">
                                <span>Open Customer App</span>
                                <i data-lucide="arrow-right" className="w-4 h-4 group-hover:translate-x-1 transition"></i>
                            </div>
                        </a>

                        {/* 2. Merchant Card */}
                        <a
                            href="merchant.html"
                            className="group bg-white rounded-3xl border border-sage-200 p-6 hover:border-forest-400 hover:shadow-xl transition-all duration-300 flex flex-col justify-between"
                        >
                            <div className="space-y-4">
                                <div className="w-12 h-12 rounded-2xl bg-amber-50 text-amber-700 border border-amber-200 flex items-center justify-center font-black group-hover:bg-amber-600 group-hover:text-white transition">
                                    <i data-lucide="store" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <span className="text-[10px] font-black uppercase tracking-wider text-amber-700 bg-amber-50 px-2 py-0.5 rounded">Sprint 2 & 4</span>
                                    <h3 className="font-display font-bold text-xl text-ink-950 mt-1">Merchant Kitchen</h3>
                                    <p className="text-xs text-ink-500 mt-1 leading-relaxed">
                                        Set up store profiles, manage menus & categories, toggle item stock, and accept or reject live orders.
                                    </p>
                                </div>
                            </div>
                            <div className="pt-6 mt-4 border-t border-sage-100 flex items-center justify-between text-xs font-bold text-amber-700">
                                <span>Open Kitchen Portal</span>
                                <i data-lucide="arrow-right" className="w-4 h-4 group-hover:translate-x-1 transition"></i>
                            </div>
                        </a>

                        {/* 3. Driver Card */}
                        <a
                            href="driver.html"
                            className="group bg-white rounded-3xl border border-sage-200 p-6 hover:border-forest-400 hover:shadow-xl transition-all duration-300 flex flex-col justify-between"
                        >
                            <div className="space-y-4">
                                <div className="w-12 h-12 rounded-2xl bg-blue-50 text-blue-700 border border-blue-200 flex items-center justify-center font-black group-hover:bg-blue-600 group-hover:text-white transition">
                                    <i data-lucide="bike" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <span className="text-[10px] font-black uppercase tracking-wider text-blue-700 bg-blue-50 px-2 py-0.5 rounded">Sprint 5</span>
                                    <h3 className="font-display font-bold text-xl text-ink-950 mt-1">Driver Dispatch</h3>
                                    <p className="text-xs text-ink-500 mt-1 leading-relaxed">
                                        Accept available delivery requests, broadcast live pickup and delivery status updates, and review earnings.
                                    </p>
                                </div>
                            </div>
                            <div className="pt-6 mt-4 border-t border-sage-100 flex items-center justify-between text-xs font-bold text-blue-700">
                                <span>Open Dispatch Board</span>
                                <i data-lucide="arrow-right" className="w-4 h-4 group-hover:translate-x-1 transition"></i>
                            </div>
                        </a>

                        {/* 4. Admin Card */}
                        <a
                            href="admin.html"
                            className="group bg-white rounded-3xl border border-sage-200 p-6 hover:border-forest-400 hover:shadow-xl transition-all duration-300 flex flex-col justify-between"
                        >
                            <div className="space-y-4">
                                <div className="w-12 h-12 rounded-2xl bg-purple-50 text-purple-700 border border-purple-200 flex items-center justify-center font-black group-hover:bg-purple-600 group-hover:text-white transition">
                                    <i data-lucide="shield-check" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <span className="text-[10px] font-black uppercase tracking-wider text-purple-700 bg-purple-50 px-2 py-0.5 rounded">Sprint 6</span>
                                    <h3 className="font-display font-bold text-xl text-ink-950 mt-1">Admin Control</h3>
                                    <p className="text-xs text-ink-500 mt-1 leading-relaxed">
                                        Manage user directory, activate/deactivate accounts, verify merchants, monitor orders, and view analytics.
                                    </p>
                                </div>
                            </div>
                            <div className="pt-6 mt-4 border-t border-sage-100 flex items-center justify-between text-xs font-bold text-purple-700">
                                <span>Open Admin Hub</span>
                                <i data-lucide="arrow-right" className="w-4 h-4 group-hover:translate-x-1 transition"></i>
                            </div>
                        </a>

                    </div>
                </section>

                {/* Architecture & Sprints Breakdown */}
                <section className="py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
                    <div className="bg-white rounded-3xl border border-sage-200 p-8 shadow-sm space-y-6">
                        <div className="flex flex-wrap items-center justify-between gap-4">
                            <div>
                                <h3 className="font-display font-bold text-2xl text-ink-950">System Architecture & Sprint Progress</h3>
                                <p className="text-xs text-ink-500">Android Mobile App (Kotlin) ➔ RESTful API ➔ Spring Boot ➔ MySQL Database</p>
                            </div>
                            <div className="flex items-center gap-2 text-xs font-bold">
                                <span className="px-3 py-1 bg-mint-100 text-forest-800 rounded-full border border-mint-300">JWT Enabled</span>
                                <span className="px-3 py-1 bg-cream-200 text-ink-800 rounded-full border border-sage-300">OpenAPI / Swagger</span>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 text-xs">
                            <div className="p-4 rounded-2xl bg-cream-50 border border-sage-200 space-y-1">
                                <span className="font-bold text-forest-700">Sprint 1: Auth & Database</span>
                                <p className="text-ink-600 font-medium">Customer registration, multi-role JWT authentication, default address management.</p>
                            </div>
                            <div className="p-4 rounded-2xl bg-cream-50 border border-sage-200 space-y-1">
                                <span className="font-bold text-forest-700">Sprint 2: Merchant Storefront</span>
                                <p className="text-ink-600 font-medium">Store profile setup, category hierarchy, item options & live stock toggling.</p>
                            </div>
                            <div className="p-4 rounded-2xl bg-cream-50 border border-sage-200 space-y-1">
                                <span className="font-bold text-forest-700">Sprint 3: Customer Discovery</span>
                                <p className="text-ink-600 font-medium">Restaurant search, distance calculations, active cart with backend pricing validation.</p>
                            </div>
                            <div className="p-4 rounded-2xl bg-cream-50 border border-sage-200 space-y-1">
                                <span className="font-bold text-forest-700">Sprint 4: Payment & State Machine</span>
                                <p className="text-ink-600 font-medium">Modular mock KHQR payment, merchant accept/reject workflow, strict state progression.</p>
                            </div>
                            <div className="p-4 rounded-2xl bg-cream-50 border border-sage-200 space-y-1">
                                <span className="font-bold text-forest-700">Sprint 5: Driver Dispatch</span>
                                <p className="text-ink-600 font-medium">Driver job board, delivery assignment, status updates, live tracking screen.</p>
                            </div>
                            <div className="p-4 rounded-2xl bg-cream-50 border border-sage-200 space-y-1">
                                <span className="font-bold text-forest-700">Sprint 6: Admin Governance</span>
                                <p className="text-ink-600 font-medium">User directory management, active/inactive controls, sales reports, system hardening.</p>
                            </div>
                        </div>
                    </div>
                </section>

                {/* Footer */}
                <footer className="mt-auto py-8 bg-ink-950 text-white text-xs border-t border-ink-800">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-mint-100/70">
                        <div className="flex items-center gap-2">
                            <span className="font-bold text-white">FoodEats Platform</span>
                            <span>• Smart Food Delivery Mobile Application</span>
                        </div>
                        <div className="flex items-center gap-4">
                            <a href="customer.html" className="hover:text-white transition">Customer</a>
                            <a href="merchant.html" className="hover:text-white transition">Merchant</a>
                            <a href="driver.html" className="hover:text-white transition">Driver</a>
                            <a href="admin.html" className="hover:text-white transition">Admin</a>
                        </div>
                    </div>
                </footer>

                {/* SINGLE-FORM AUTHENTICATION MODAL (ROLE AUTO-ROUTING) */}
                {showAuthModal && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                        <div className="fixed inset-0 bg-ink-950/70 backdrop-blur-sm" onClick={() => setShowAuthModal(false)}></div>
                        <div className="relative bg-white rounded-3xl border border-sage-200 max-w-md w-full p-6 sm:p-8 shadow-2xl space-y-6 z-10">

                            {/* Header */}
                            <div className="flex items-center justify-between pb-3 border-b border-sage-100">
                                <div>
                                    <h3 className="font-display font-bold text-xl text-ink-950">
                                        {authTab === 'login' ? 'Single-Form Authentication' : 'Create Customer Account'}
                                    </h3>
                                    <span className="text-xs font-semibold text-ink-500">
                                        {authTab === 'login' ? 'Automatic role detection & routing' : 'Register for immediate food ordering'}
                                    </span>
                                </div>
                                <button onClick={() => setShowAuthModal(false)} className="p-2 hover:bg-sage-100 rounded-full text-ink-400">
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>
                            </div>

                            {/* Tab Switcher */}
                            <div className="flex p-1 bg-cream-100 rounded-2xl border border-sage-200 text-xs font-bold">
                                <button
                                    onClick={() => { setAuthTab('login'); setAuthError(''); }}
                                    className={`flex-1 py-2 rounded-xl transition ${authTab === 'login' ? 'bg-white text-ink-950 shadow-sm' : 'text-ink-600 hover:text-ink-950'}`}
                                >
                                    Log In / Sign In
                                </button>
                                <button
                                    onClick={() => { setAuthTab('register'); setAuthError(''); }}
                                    className={`flex-1 py-2 rounded-xl transition ${authTab === 'register' ? 'bg-white text-ink-950 shadow-sm' : 'text-ink-600 hover:text-ink-950'}`}
                                >
                                    Register Account
                                </button>
                            </div>

                            {/* TAB 1: LOG IN */}
                            {authTab === 'login' && (
                                <form onSubmit={handleLoginSubmit} className="space-y-4">
                                    {authError && (
                                        <div className="p-3 rounded-xl bg-rust-500/10 border border-rust-500/30 text-xs font-semibold text-rust-600 flex items-center gap-2">
                                            <i data-lucide="alert-circle" className="w-4 h-4 shrink-0"></i>
                                            <span>{authError}</span>
                                        </div>
                                    )}

                                    <div>
                                        <label className="block text-xs font-bold text-ink-700 mb-1.5">Email Address</label>
                                        <input
                                            type="email"
                                            required
                                            value={authEmail}
                                            onChange={e => setAuthEmail(e.target.value)}
                                            placeholder="Enter your email"
                                            className="w-full bg-cream-50/70 border border-sage-200 rounded-2xl px-3.5 py-2.5 text-xs font-semibold text-ink-900 focus:outline-none focus:border-forest-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-ink-700 mb-1.5">Password</label>
                                        <input
                                            type="password"
                                            required
                                            value={authPassword}
                                            onChange={e => setAuthPassword(e.target.value)}
                                            placeholder="••••••••"
                                            className="w-full bg-cream-50/70 border border-sage-200 rounded-2xl px-3.5 py-2.5 text-xs font-semibold text-ink-900 focus:outline-none focus:border-forest-500"
                                        />
                                    </div>

                                    {/* 1-Click Role Fill Buttons for Testing */}
                                    <div className="p-3 bg-cream-100 rounded-2xl border border-sage-200 space-y-2">
                                        <span className="text-[10px] font-extrabold uppercase tracking-wider text-ink-500 block">⚡ Quick Demo Credentials:</span>
                                        <div className="grid grid-cols-2 gap-2 text-[11px] font-bold">
                                            <button
                                                type="button"
                                                onClick={() => { setAuthEmail('customer@example.com'); setAuthPassword('password123'); }}
                                                className="p-1.5 bg-white rounded-lg border border-sage-200 hover:border-forest-400 text-forest-700 text-left truncate"
                                            >
                                                🛍️ Customer
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => { setAuthEmail('merchant@example.com'); setAuthPassword('password123'); }}
                                                className="p-1.5 bg-white rounded-lg border border-sage-200 hover:border-amber-400 text-amber-700 text-left truncate"
                                            >
                                                🍳 Merchant
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => { setAuthEmail('driver@example.com'); setAuthPassword('password123'); }}
                                                className="p-1.5 bg-white rounded-lg border border-sage-200 hover:border-blue-400 text-blue-700 text-left truncate"
                                            >
                                                🛵 Driver
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => { setAuthEmail('admin@example.com'); setAuthPassword('password123'); }}
                                                className="p-1.5 bg-white rounded-lg border border-sage-200 hover:border-purple-400 text-purple-700 text-left truncate"
                                            >
                                                🛡️ Admin
                                            </button>
                                        </div>
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full py-3 bg-forest-600 hover:bg-forest-700 text-white rounded-2xl text-xs font-bold transition shadow-md flex items-center justify-center gap-2"
                                    >
                                        <i data-lucide="log-in" className="w-4 h-4"></i>
                                        <span>Sign In & Route to Portal</span>
                                    </button>
                                </form>
                            )}

                            {/* TAB 2: REGISTER */}
                            {authTab === 'register' && (
                                <form onSubmit={handleRegisterSubmit} className="space-y-3.5">
                                    {authError && (
                                        <div className="p-3 rounded-xl bg-rust-500/10 border border-rust-500/30 text-xs font-semibold text-rust-600 flex items-center gap-2">
                                            <i data-lucide="alert-circle" className="w-4 h-4 shrink-0"></i>
                                            <span>{authError}</span>
                                        </div>
                                    )}

                                    <div>
                                        <label className="block text-xs font-bold text-ink-700 mb-1">Full Name</label>
                                        <input
                                            type="text"
                                            required
                                            value={regName}
                                            onChange={e => setRegName(e.target.value)}
                                            placeholder="Sokha Mean"
                                            className="w-full bg-cream-50/70 border border-sage-200 rounded-2xl px-3.5 py-2 text-xs font-semibold text-ink-900 focus:outline-none focus:border-forest-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-ink-700 mb-1">Email Address</label>
                                        <input
                                            type="email"
                                            required
                                            value={regEmail}
                                            onChange={e => setRegEmail(e.target.value)}
                                            placeholder="sokha@example.com"
                                            className="w-full bg-cream-50/70 border border-sage-200 rounded-2xl px-3.5 py-2 text-xs font-semibold text-ink-900 focus:outline-none focus:border-forest-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-ink-700 mb-1">Phone Number</label>
                                        <input
                                            type="tel"
                                            value={regPhone}
                                            onChange={e => setRegPhone(e.target.value)}
                                            placeholder="+855 12 345 678"
                                            className="w-full bg-cream-50/70 border border-sage-200 rounded-2xl px-3.5 py-2 text-xs font-semibold text-ink-900 focus:outline-none focus:border-forest-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-ink-700 mb-1">Delivery Address</label>
                                        <input
                                            type="text"
                                            value={regAddress}
                                            onChange={e => setRegAddress(e.target.value)}
                                            placeholder="Building 42, St. 302, BKK1, Phnom Penh"
                                            className="w-full bg-cream-50/70 border border-sage-200 rounded-2xl px-3.5 py-2 text-xs font-semibold text-ink-900 focus:outline-none focus:border-forest-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-ink-700 mb-1">Password</label>
                                        <input
                                            type="password"
                                            required
                                            value={regPassword}
                                            onChange={e => setRegPassword(e.target.value)}
                                            placeholder="••••••••"
                                            className="w-full bg-cream-50/70 border border-sage-200 rounded-2xl px-3.5 py-2 text-xs font-semibold text-ink-900 focus:outline-none focus:border-forest-500"
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full py-3 bg-forest-600 hover:bg-forest-700 text-white rounded-2xl text-xs font-bold transition shadow-md flex items-center justify-center gap-2"
                                    >
                                        <i data-lucide="user-plus" className="w-4 h-4"></i>
                                        <span>Create Customer Account</span>
                                    </button>
                                </form>
                            )}

                        </div>
                    </div>
                )}

            </div>
        );
    }

    ReactDOM.render(<PlatformGateway />, document.getElementById('root'));
</script>
</body>
</html>
