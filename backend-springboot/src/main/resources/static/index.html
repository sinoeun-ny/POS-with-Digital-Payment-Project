    const INITIAL_ORDERS = [
        {
            id: 101,
            customerId: 'c1',
            merchant: "Zando Burger & Grill",
            merchantId: 1,
            items: "2x Double Truffle Smash Burger ($13.00)",
            itemsCount: 2,
            subtotal: 13.00,
            deliveryFee: 1.50,
            total: 14.50,

    function CustomerApp() {
        // Authenticated user state
        const [authUser, setAuthUser] = useState(() => {
            if (localStorage.getItem('foodeats_guest_mode') === 'true') {
                return null;
            }
            const saved = localStorage.getItem('foodeats_auth_user');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.role === 'CUSTOMER') return parsed;
                } catch (e) {}
            }
            return null; // Guest mode by default
        });

        // App state
        const [restaurants, setRestaurants] = useState(INITIAL_RESTAURANTS);
        const [selectedRestaurant, setSelectedRestaurant] = useState(null);
        const [selectedCategory, setSelectedCategory] = useState('ALL');
        const [searchQuery, setSearchQuery] = useState('');
        const [cart, setCart] = useState([]);
        const [orders, setOrders] = useState(INITIAL_ORDERS);
        const [activeView, setActiveView] = useState('discovery'); // 'discovery' | 'restaurant' | 'orders' | 'profile'

        // Filter, Sorting & Endless Scroll state
        const [sortBy, setSortBy] = useState('featured'); // 'featured' | 'rating' | 'fastest' | 'fee' | 'name'
        const [onlyTopRated, setOnlyTopRated] = useState(false);
        const [onlyLowFee, setOnlyLowFee] = useState(false);
        const [onlyFastDelivery, setOnlyFastDelivery] = useState(false);
        const [displayLimit, setDisplayLimit] = useState(6);
        const [isLoadingMore, setIsLoadingMore] = useState(false);
        const [autoShuffleSeed] = useState(() => Date.now() + Math.floor(Math.random() * 100000));

        // Modals
        const [showAuthModal, setShowAuthModal] = useState(false);
        const [authTab, setAuthTab] = useState('login'); // 'login' | 'register'
        const [showCartDrawer, setShowCartDrawer] = useState(false);
        const [showCheckoutModal, setShowCheckoutModal] = useState(false);
        const [showItemDetailModal, setShowItemDetailModal] = useState(null);
        const [selectedAddress, setSelectedAddress] = useState(() => {
            if (authUser && authUser.addresses && authUser.addresses.length > 0) {
                return authUser.addresses[0];
            }
            return { id: 'default', label: 'Default Delivery', address: 'Building 42, St. 302, BKK1, Phnom Penh' };
        });
        const [paymentMethod, setPaymentMethod] = useState('MOCK_KHQR');
        const [isProcessingPayment, setIsProcessingPayment] = useState(false);
        const [toast, setToast] = useState(null);

        // Production Policy & Customer Support Modals (Items 19 & 20 in Creator Checklist)
        const [showPrivacyModal, setShowPrivacyModal] = useState(false);
        const [showContactModal, setShowContactModal] = useState(false);
        const [contactName, setContactName] = useState('');
        const [contactEmail, setContactEmail] = useState('');
        const [contactSubject, setContactSubject] = useState('Order Tracking');
        const [contactMessage, setContactMessage] = useState('');
        const [contactSubmitting, setContactSubmitting] = useState(false);

        const handleContactSubmit = (e) => {
            e.preventDefault();
            setContactSubmitting(true);
            setTimeout(() => {
                setContactSubmitting(false);
                setShowContactModal(false);
                setContactMessage('');
                showToast("Inquiry received! Our Phnom Penh support team will reach out shortly.", "success");
            }, 700);
        };

        // Auth Form States
        const [loginEmail, setLoginEmail] = useState('');
        const [loginPassword, setLoginPassword] = useState('');
        const [loginError, setLoginError] = useState('');

        const [regName, setRegName] = useState('');
        const [regEmail, setRegEmail] = useState('');
        const [regPhone, setRegPhone] = useState('');
        const [regPassword, setRegPassword] = useState('');
        const [regAddress, setRegAddress] = useState('');
        const [regError, setRegError] = useState('');

        const showToast = (msg, type = 'success') => {
            setToast({ msg, type });
            setTimeout(() => setToast(null), 3500);
        };

        // Fetch backend merchants on mount
        useEffect(() => {
            const fetchMerchants = async () => {
                try {
                    const res = await fetch(`${API_BASE}/api/merchants`);
                    if (res.ok) {
                        const data = await res.json();
                        if (Array.isArray(data) && data.length > 0) {
                            setRestaurants(data.map(m => ({
                                id: m.id,
                                name: m.name,
                                cuisine: m.cuisineType || m.category || "Gourmet Dining",
                                category: m.category || "General",
                                distance: "1.5 km",
                                rating: m.rating || 4.9,
                                reviewsCount: m.reviewsCount || 120,
                                deliveryFee: m.deliveryFee || 1.50,
                                deliveryTime: "25 min",
                                address: m.address || "Phnom Penh, Cambodia",
                                imageUrl: m.imageUrl || "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&auto=format&fit=crop&q=80",
                                description: m.description || "Authentic culinary favorites prepared fresh upon order.",
                                menu: m.menuItems || []
                            })));
                        }
                    }
                } catch (e) {
                    console.log("Using initial restaurant discovery data");
                }
            };
            fetchMerchants();
        }, []);

        useEffect(() => {
            if (window.lucide) window.lucide.createIcons();
        }, [activeView, selectedRestaurant, cart, orders, showCartDrawer, showCheckoutModal, showAuthModal, authTab, showItemDetailModal, toast, authUser, displayLimit, sortBy, onlyTopRated, onlyLowFee, onlyFastDelivery, isLoadingMore, showPrivacyModal, showContactModal]);

        // Cart calculations (Strict backend-aligned pricing)
        const cartSubtotal = useMemo(() => {
            return cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        }, [cart]);

        const currentMerchant = useMemo(() => {
            if (cart.length === 0) return null;
            return restaurants.find(r => r.id === cart[0].merchantId) || restaurants[0];
        }, [cart, restaurants]);

        const cartDeliveryFee = currentMerchant ? (currentMerchant.deliveryFee || 1.50) : 0;
        const cartTotal = cartSubtotal > 0 ? (cartSubtotal + cartDeliveryFee) : 0;

        const handleAddToCart = (item, merchant) => {
            if (cart.length > 0 && cart[0].merchantId !== merchant.id) {
                if (!confirm(`Your cart already contains items from "${cart[0].merchantName}". Would you like to clear your cart and start a new order with "${merchant.name}"?`)) {
                    return;
                }
                setCart([{
                    id: item.id,
                    name: item.name,
                    price: item.price,
                    imageUrl: item.imageUrl,
                    merchantId: merchant.id,
                    merchantName: merchant.name,
                    quantity: 1
                }]);
                showToast(`Started new order from ${merchant.name}!`);
                return;
            }

            setCart(prev => {
                const existing = prev.find(i => i.id === item.id);
                if (existing) {
                    return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
                } else {
                    return [...prev, {
                        id: item.id,
                        name: item.name,
                        price: item.price,
                        imageUrl: item.imageUrl,
                        merchantId: merchant.id,
                        merchantName: merchant.name,
                        quantity: 1
                    }];
                }
            });
            showToast(`Added ${item.name} to cart!`);
        };

        const handleUpdateQuantity = (itemId, delta) => {
            setCart(prev => {
                return prev.map(item => {
                    if (item.id === itemId) {
                        const newQ = item.quantity + delta;
                        return newQ > 0 ? { ...item, quantity: newQ } : null;
                    }
                    return item;
                }).filter(Boolean);
            });
        };

        // Authentication Handlers
        const handleLoginSubmit = async (e) => {
            e.preventDefault();
            setLoginError('');

            const email = loginEmail.trim().toLowerCase();
            const password = loginPassword.trim();

            if (!email || !password) {
                setLoginError('Please provide both email and password.');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    const loggedUser = {
                        id: data.id || data.userId,
                        name: data.name,
                        email: data.email,
                        phone: data.phone || "",
                        role: data.role || "CUSTOMER",
                        token: data.token,
                        addresses: data.addresses || [
                            { id: 'a1', label: "Home (BKK1)", address: "Building 42, St. 302, BKK1, Phnom Penh", isDefault: true },
                            { id: 'a2', label: "Office", address: "Vattanac Tower Level 14, Phnom Penh", isDefault: false }
                        ]
                    };

                    localStorage.setItem('foodeats_auth_token', data.token);
                    localStorage.setItem('foodeats_auth_user', JSON.stringify(loggedUser));
                    localStorage.removeItem('foodeats_guest_mode');

                    if (data.role === 'ADMIN') {
                        showToast("Admin account verified. Redirecting to Executive Hub...", "info");
                        setTimeout(() => window.location.href = 'admin.html', 800);
                        return;
                    }
                    if (data.role === 'MERCHANT') {
                        showToast(`Welcome Merchant ${loggedUser.name}! Redirecting to Kitchen Console...`, "info");
                        setTimeout(() => window.location.href = 'merchant.html', 800);
                        return;
                    }
                    if (data.role === 'DRIVER') {
                        showToast("Couriers operate via Telegram Bot @xoradelivery_bot! Opening Telegram...", "info");
                        setTimeout(() => window.open('https://t.me/xoradelivery_bot', '_blank'), 1000);
                        return;
                    }

                    // Default Customer login
                    setAuthUser(loggedUser);
                    setShowAuthModal(false);
                    showToast(`Welcome back, ${loggedUser.name}!`);
                    return;
                }

                const errData = await response.json().catch(() => ({}));
                setLoginError(errData.message || 'Invalid email or password. Please try again.');
            } catch (err) {
                setLoginError('Cannot connect to authentication service. Please ensure the backend is running.');
            }
        };
        const handleRegisterSubmit = async (e) => {
            e.preventDefault();
            setRegError('');

            if (!regName.trim() || !regEmail.trim() || !regPassword.trim()) {
                setRegError('Please complete all required fields.');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: regName.trim(),
                        email: regEmail.trim().toLowerCase(),
                        password: regPassword.trim(),
                        phone: regPhone.trim() || "+855 12 888 999",
                        address: regAddress.trim() || "Phnom Penh, Cambodia",
                        role: "CUSTOMER"
                    })
                });

                const data = await response.json();
                if (!response.ok) {
                    setRegError(data.message || 'Registration failed. Please try again.');
                    return;
                }

                const newCustomer = {
                    id: data.id,
                    name: data.name,
                    email: data.email,
                    phone: regPhone.trim() || "+855 12 888 999",
                    role: data.role || "CUSTOMER",
                    token: data.token,
                    addresses: [
                        {
                            id: 'a_' + Date.now(),
                            label: "Default Address",
                            address: regAddress.trim() || "Phnom Penh, Cambodia",
                            isDefault: true
                        }
                    ]
                };

                setAuthUser(newCustomer);
                localStorage.setItem('foodeats_auth_token', data.token);
                localStorage.setItem('foodeats_auth_user', JSON.stringify(newCustomer));
                localStorage.removeItem('foodeats_guest_mode');
                setSelectedAddress(newCustomer.addresses[0]);
                setShowAuthModal(false);

                try {
                    const res = await fetch(`${API_BASE}/api/menu?merchantId=${rest.id}`);
                    if (res.ok) {
                        const items = await res.json();
                        if (Array.isArray(items)) {
                            setSelectedRestaurant(prev => (prev && prev.id === rest.id ? { ...prev, menu: items } : prev));

        // Dynamic Cuisine Categories from active restaurants catalog
        const categoriesList = useMemo(() => {

            ['Burgers', 'Japanese', 'Coffee & Bakery', 'Khmer', 'Desserts'].forEach(c => set.add(c));
            return Array.from(set);

        // Filtered & Sorted Restaurants (Auto-Shuffled for Natural Discovery)

            let list = restaurants.filter(r => {
                const catStr = (r.category || '').toLowerCase();
                const cuisineStr = (r.cuisine || '').toLowerCase();
                const nameStr = (r.name || '').toLowerCase();
                const queryStr = (searchQuery || '').toLowerCase();

                const matchCategory = selectedCategory === 'ALL' || catStr.includes(selectedCategory.toLowerCase()) || cuisineStr.includes(selectedCategory.toLowerCase());
                const matchSearch = !queryStr || nameStr.includes(queryStr) || cuisineStr.includes(queryStr) || (Array.isArray(r.menu) && r.menu.some(m => (m.name || '').toLowerCase().includes(queryStr)));
                
                const matchTopRated = !onlyTopRated || ((r.rating != null ? r.rating : 0) >= 4.8);
                const matchLowFee = !onlyLowFee || ((r.deliveryFee != null ? r.deliveryFee : 1.50) <= 1.50);
                
                const delTimeNum = parseInt(r.deliveryTime) || 25;
                const matchFast = !onlyFastDelivery || (delTimeNum <= 25);

                return matchCategory && matchSearch && matchTopRated && matchLowFee && matchFast;
            });

            if (sortBy === 'rating') {
                list = [...list].sort((a, b) => (b.rating || 0) - (a.rating || 0));
            } else if (sortBy === 'fastest') {
                list = [...list].sort((a, b) => (parseInt(a.deliveryTime) || 25) - (parseInt(b.deliveryTime) || 25));
            } else if (sortBy === 'fee') {
                list = [...list].sort((a, b) => ((a.deliveryFee != null ? a.deliveryFee : 1.50) - (b.deliveryFee != null ? b.deliveryFee : 1.50)));
            } else if (sortBy === 'name') {
                list = [...list].sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            } else {
                // 'featured' / default: AUTO-SHUFFLED ORDER!
                list = [...list];
                let seed = autoShuffleSeed;
                const pseudoRandom = () => {
                    seed = (seed * 9301 + 49297) % 233280;
                    return seed / 233280;
                };
                for (let i = list.length - 1; i > 0; i--) {
                    const j = Math.floor(pseudoRandom() * (i + 1));
                    [list[i], list[j]] = [list[j], list[i]];
                }
            }

            return list;

            for (let i = 0; i < targetCount; i++) {
                const origIndex = i % filteredAndSortedRestaurants.length;
                const rest = filteredAndSortedRestaurants[origIndex];
                const cycle = Math.floor(i / filteredAndSortedRestaurants.length);
                const tag = cycle > 0 ? RECOMMENDATION_TAGS[(i + cycle) % RECOMMENDATION_TAGS.length] : null;

                result.push({
                    ...rest,
                    displayKey: `${rest.id}-scroll-${i}`,

                    isReLoop: cycle > 0

                    </div>
                )}

                {/* MODAL 1: PRIVACY POLICY (Item 19 in Creator Checklist) */}
                {showPrivacyModal && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                        <div className="fixed inset-0 bg-ink-950/70 backdrop-blur-sm" onClick={() => setShowPrivacyModal(false)}></div>
                        <div className="relative bg-white rounded-3xl border border-sage-200 max-w-lg w-full p-6 sm:p-8 shadow-2xl space-y-5 z-10 max-h-[85vh] overflow-y-auto">
                            <div className="flex items-center justify-between pb-3 border-b border-sage-100">
                                <div className="flex items-center gap-2.5">
                                    <div className="w-9 h-9 rounded-xl bg-forest-50 border border-forest-200 text-forest-700 flex items-center justify-center font-bold">
                                        <i data-lucide="shield-check" className="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-display font-bold text-xl text-ink-950">FoodEats Privacy Policy</h3>
                                        <span className="text-[11px] font-semibold text-ink-500">Compliance & Data Protection Standards</span>
                                    </div>
                                </div>
                                <button onClick={() => setShowPrivacyModal(false)} className="p-2 hover:bg-sage-100 rounded-full text-ink-400">
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>
                            </div>

                            <div className="space-y-4 text-xs text-ink-700 leading-relaxed">
                                <div className="p-3 bg-cream-50 rounded-2xl border border-sage-200">
                                    <h4 className="font-bold text-ink-950 mb-1 flex items-center gap-1.5">
                                        <i data-lucide="lock" className="w-3.5 h-3.5 text-forest-600"></i>
                                        1. Customer Information We Collect
                                    </h4>
                                    <p>When you register or order, we securely store your name, email, contact telephone number, and physical delivery address in MySQL. This data is exclusively used to fulfill meals and deliver via dispatch drivers.</p>
                                </div>

                                <div className="p-3 bg-cream-50 rounded-2xl border border-sage-200">
                                    <h4 className="font-bold text-ink-950 mb-1 flex items-center gap-1.5">
                                        <i data-lucide="credit-card" className="w-3.5 h-3.5 text-forest-600"></i>
                                        2. Digital Payment & KHQR Security
                                    </h4>
                                    <p>We do not store raw banking passwords or credit card CVV codes. Digital KHQR payments and tokenized payment requests are handled through secure SHA-256 tokenization aligned with National Bank of Cambodia standards.</p>
                                </div>

                                <div className="p-3 bg-cream-50 rounded-2xl border border-sage-200">
                                    <h4 className="font-bold text-ink-950 mb-1 flex items-center gap-1.5">
                                        <i data-lucide="map-pin" className="w-3.5 h-3.5 text-forest-600"></i>
                                        3. Real-Time Courier Tracking
                                    </h4>
                                    <p>Courier telemetry and live GPS routes are only active during order delivery. Once your meal status switches to DELIVERED, location tracking is terminated.</p>
                                </div>

                                <div className="p-3 bg-cream-50 rounded-2xl border border-sage-200">
                                    <h4 className="font-bold text-ink-950 mb-1 flex items-center gap-1.5">
                                        <i data-lucide="user-check" className="w-3.5 h-3.5 text-forest-600"></i>
                                        4. User Rights & Account Control
                                    </h4>
                                    <p>You may update your saved addresses at any time in your Customer Profile or sign out to browse in Guest Mode. For account deletion inquiries, contact our team below.</p>
                                </div>
                            </div>

                            <div className="pt-3 border-t border-sage-100 flex justify-end">
                                <button
                                    onClick={() => setShowPrivacyModal(false)}
                                    className="px-5 py-2.5 bg-forest-600 hover:bg-forest-700 text-white rounded-xl text-xs font-bold transition shadow-sm"
                                >
                                    I Understand & Agree
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {/* MODAL 2: WORKING CONTACT FORM (Item 20 in Creator Checklist) */}
                {showContactModal && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                        <div className="fixed inset-0 bg-ink-950/70 backdrop-blur-sm" onClick={() => setShowContactModal(false)}></div>
                        <div className="relative bg-white rounded-3xl border border-sage-200 max-w-md w-full p-6 sm:p-8 shadow-2xl space-y-4 z-10">
                            <div className="flex items-center justify-between pb-3 border-b border-sage-100">
                                <div className="flex items-center gap-2.5">
                                    <div className="w-9 h-9 rounded-xl bg-forest-50 border border-forest-200 text-forest-700 flex items-center justify-center font-bold">
                                        <i data-lucide="message-square" className="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-display font-bold text-xl text-ink-950">Customer Support & Inquiries</h3>
                                        <span className="text-[11px] font-semibold text-ink-500">Phnom Penh Operations Center</span>
                                    </div>
                                </div>
                                <button onClick={() => setShowContactModal(false)} className="p-2 hover:bg-sage-100 rounded-full text-ink-400">
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>
                            </div>

                            <form onSubmit={handleContactSubmit} className="space-y-3.5 text-xs">
                                <div>
                                    <label className="block font-bold text-ink-700 mb-1">Your Full Name</label>
                                    <input
                                        type="text"
                                        required
                                        value={contactName || (authUser ? authUser.name : '')}
                                        onChange={e => setContactName(e.target.value)}
                                        placeholder="e.g. Sokha Mean"
                                        className="w-full bg-cream-50/70 border border-sage-200 rounded-xl px-3 py-2 text-ink-900 focus:outline-none focus:border-forest-500 font-semibold"
                                    />
                                </div>

                                <div>
                                    <label className="block font-bold text-ink-700 mb-1">Email or Telegram / Phone</label>
                                    <input
                                        type="text"
                                        required
                                        value={contactEmail || (authUser ? authUser.email : '')}
                                        onChange={e => setContactEmail(e.target.value)}
                                        placeholder="customer@example.com or +855 12..."
                                        className="w-full bg-cream-50/70 border border-sage-200 rounded-xl px-3 py-2 text-ink-900 focus:outline-none focus:border-forest-500 font-semibold"
                                    />
                                </div>

                                <div>
                                    <label className="block font-bold text-ink-700 mb-1">Inquiry Category</label>
                                    <select
                                        value={contactSubject}
                                        onChange={e => setContactSubject(e.target.value)}
                                        className="w-full bg-cream-50/70 border border-sage-200 rounded-xl px-3 py-2 text-ink-900 focus:outline-none focus:border-forest-500 font-bold cursor-pointer"
                                    >
                                        <option value="Order Tracking">🛵 Order Assistance & Delivery Delay</option>
                                        <option value="Payment Inquiry">💳 Payment & KHQR Refund Inquiry</option>
                                        <option value="Restaurant Partner">🍳 Restaurant Merchant Partnership</option>
                                        <option value="General Feedback">💬 General Platform Feedback</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block font-bold text-ink-700 mb-1">Message Details</label>
                                    <textarea
                                        required
                                        rows="3"
                                        value={contactMessage}
                                        onChange={e => setContactMessage(e.target.value)}
                                        placeholder="Tell us what you need help with..."
                                        className="w-full bg-cream-50/70 border border-sage-200 rounded-xl px-3 py-2 text-ink-900 focus:outline-none focus:border-forest-500 font-medium resize-none"
                                    ></textarea>
                                </div>

                                <button
                                    type="submit"
                                    disabled={contactSubmitting}
                                    className="w-full py-3 bg-forest-600 hover:bg-forest-700 text-white rounded-xl font-bold transition shadow-md flex items-center justify-center gap-2 disabled:opacity-50"
                                >
                                    {contactSubmitting ? (
                                        <>
                                            <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                                            <span>Submitting Inquiry...</span>
                                        </>
                                    ) : (
                                        <>
                                            <i data-lucide="send" className="w-4 h-4"></i>
                                            <span>Send Message to FoodEats Support</span>
                                        </>
                                    )}
                                </button>
                            </form>
                        </div>
                    </div>
                )}



            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CustomerApp />);
</script>
</body>
</html>
